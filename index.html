<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>版本總覽</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #656d76;
    --line: #d8dee4; --accent: #0969da; --accent-bg: #ddf4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0;
      --line: #30363d; --accent: #4493f8; --accent-bg: #121d2f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .latest {
    display: block; background: var(--accent-bg); border: 1px solid var(--accent);
    border-radius: 10px; padding: 20px; text-decoration: none; color: var(--text); margin-bottom: 28px;
  }
  .latest .tag { color: var(--accent); font-weight: 600; font-size: .9rem; }
  .latest .name { font-size: 1.3rem; font-weight: 600; margin: 4px 0; }
  .latest .url { color: var(--muted); font-size: .85rem; word-break: break-all; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  ul { list-style: none; padding: 0; margin: 0; background: var(--card);
       border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  li + li { border-top: 1px solid var(--line); }
  li a { display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px;
         text-decoration: none; color: var(--text); }
  li a:hover { background: var(--accent-bg); }
  .date { color: var(--muted); white-space: nowrap; }
  .msg { color: var(--muted); padding: 14px 18px; }
</style>
</head>
<body>
<main>
  <h1>版本總覽</h1>
  <p class="sub">每月更新版本一覽，點選即可開啟。</p>
  <div id="latest"></div>
  <h2>所有版本</h2>
  <ul id="list"><li class="msg">載入中…</li></ul>
</main>
<script>
  fetch('versions.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      data.sort(function (x, y) { return y.date.localeCompare(x.date); });
      var list = document.getElementById('list');
      if (!data.length) { list.innerHTML = '<li class="msg">目前沒有版本。</li>'; return; }
      var top = data[0];
      document.getElementById('latest').innerHTML =
        '<a class="latest" href="' + top.url + '">' +
        '<div class="tag">最新版本</div>' +
        '<div class="name">' + top.note + '（' + top.date + '）</div>' +
        '<div class="url">' + top.url + '</div></a>';
      list.innerHTML = data.map(function (v) {
        return '<li><a href="' + v.url + '"><span>' + v.note + '</span>' +
               '<span class="date">' + v.date + '</span></a></li>';
      }).join('');
    })
    .catch(function () {
      document.getElementById('list').innerHTML = '<li class="msg">版本清單載入失敗，請稍後重新整理。</li>';
    });
</script>
</body>
</html>
