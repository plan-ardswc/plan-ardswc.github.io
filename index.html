<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>農村水保署數位署長筆記本</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #656d76;
    --line: #d8dee4; --accent: #0969da; --accent-bg: #ddf4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0;
      --line: #30363d; --accent: #4493f8; --accent-bg: #121d2f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .latest {
    display: block; background: var(--accent-bg); border: 1px solid var(--accent);
    border-radius: 10px; padding: 20px; text-decoration: none; color: var(--text); margin-bottom: 28px;
  }
  .latest .tag { color: var(--accent); font-weight: 600; font-size: .9rem; }
  .latest .name { font-size: 1.3rem; font-weight: 600; margin: 4px 0; }
  .latest .url { color: var(--muted); font-size: .85rem; word-break: break-all; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  ul { list-style: none; padding: 0; margin: 0; background: var(--card);
       border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  li + li { border-top: 1px solid var(--line); }
  li a { display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px;
         text-decoration: none; color: var(--text); }
  li a:hover { background: var(--accent-bg); }
  .date { color: var(--muted); white-space: nowrap; }
  .msg { color: var(--muted); padding: 14px 18px; }
  .drafts-h { margin-top: 36px; }
  .drafts-h small { color: var(--muted); font-weight: 400; font-size: .85rem; margin-left: 6px; }
  .draft { padding: 14px 18px; }
  .draft-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .draft-name { font-weight: 600; }
  .draft-desc { color: var(--muted); font-size: .9rem; }
  .btns { display: flex; gap: 8px; }
  .btn { font: inherit; font-size: .85rem; padding: 4px 12px; border-radius: 6px; cursor: pointer;
         border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .preview { display: none; width: 100%; height: 560px; margin-top: 12px;
             border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .preview.open { display: block; }
</style>
</head>
<body>
<main>
  <h1>農村水保署數位署長筆記本</h1>
  <p class="sub">每月更新版本一覽，點選即可開啟。</p>
  <div id="latest"></div>
  <h2>所有版本</h2>
  <ul id="list"><li class="msg">載入中…</li></ul>
  <h2 class="drafts-h">其他版型<small>（開發中）</small></h2>
  <ul id="drafts"><li class="msg">載入中…</li></ul>
</main>
<script>
  fetch('versions.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      data.sort(function (x, y) { return y.date.localeCompare(x.date); });
      var list = document.getElementById('list');
      if (!data.length) { list.innerHTML = '<li class="msg">目前沒有版本。</li>'; return; }
      var top = data[0];
      document.getElementById('latest').innerHTML =
        '<a class="latest" href="' + top.url + '">' +
        '<div class="tag">最新版本</div>' +
        '<div class="name">' + top.note + '（' + top.date + '發布）</div>' +
        '<div class="url">' + top.url + '</div></a>';
      list.innerHTML = data.map(function (v) {
        return '<li><a href="' + v.url + '"><span>' + v.note + '</span>' +
               '<span class="date">' + v.date + ' 發布</span></a></li>';
      }).join('');
    })
    .catch(function () {
      document.getElementById('list').innerHTML = '<li class="msg">版本清單載入失敗，請稍後重新整理。</li>';
    });
</script>
<script>
  fetch('drafts.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var box = document.getElementById('drafts');
      if (!data.length) { box.innerHTML = '<li class="msg">目前沒有開發中的版型。</li>'; return; }
      box.innerHTML = data.map(function (d, i) {
        return '<li class="draft"><div class="draft-top"><div>' +
          '<div class="draft-name">' + d.name + '</div>' +
          (d.desc ? '<div class="draft-desc">' + d.desc + '</div>' : '') +
          '</div><div class="btns">' +
          '<button class="btn" type="button" data-i="' + i + '">預覽</button>' +
          '<a class="btn" href="' + d.url + '" target="_blank" rel="noopener">開新視窗</a>' +
          '</div></div><iframe class="preview" id="pv' + i + '" title="' + d.name + '" loading="lazy"></iframe></li>';
      }).join('');
      box.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-i]'); if (!b) return;
        var f = document.getElementById('pv' + b.dataset.i);
        if (!f.src) { f.src = data[b.dataset.i].url; }
        f.classList.toggle('open');
        b.textContent = f.classList.contains('open') ? '收合' : '預覽';
      });
    })
    .catch(function () {
      document.getElementById('drafts').innerHTML = '<li class="msg">版型清單載入失敗。</li>';
    });
</script>
</body>
</html>
