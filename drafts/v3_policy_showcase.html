<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="ardswc-layout" content="V3"><meta name="ardswc-round" content="14"><title>數位署長筆記本</title><style>
:root{--bg:#F6F2EA;--ink:#17382B;--ink2:#4F5A52;--ink3:#857F72;--rule:#E4DCCD;--rule2:#CFC4B0;--och:#B4602B;--och-l:#F4E4D6;
 --y111:#C9D3C5;--y112:#B9C8B9;--y113:#7F9C88;--y114:#2F5A47;--y115:#B5602A;--y115s:#F4E4D6;--line2:#CFC4B0;
 --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU","MingLiU",serif;
 --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
.num{font-variant-numeric:tabular-nums lining-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
/* 刊頭 */
.mast{border-bottom:1px solid var(--rule)}
.mast .r1{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0 12px}
.mast .brand{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.08em}
.mast .brand small{font-family:var(--sans);font-size:12.5px;font-weight:400;letter-spacing:.04em;color:var(--ink3);margin-left:12px}
.modes{display:flex;align-items:center;gap:22px}
.modes button{border:0;background:none;padding:4px 0;font-size:14.5px;color:var(--ink2);border-bottom:2px solid transparent}
.modes button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--och)}
.modes button:hover{color:var(--ink)}
.mon{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3)}
.mon select{background:transparent;border:0;border-bottom:1px solid var(--rule2);padding:3px 2px;font-weight:700;color:var(--ink);font-size:14px}
.themes{display:flex;gap:30px;padding:6px 0 0;overflow-x:auto}
.themes button{border:0;background:none;padding:8px 0 12px;font-family:var(--serif);font-size:19px;color:var(--ink3);border-bottom:3px solid transparent;white-space:nowrap}
.themes button.on{color:var(--ink);border-bottom-color:var(--ink)}
.themes button:hover{color:var(--ink)}
.themes.dim{visibility:hidden;height:0;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--och);outline-offset:2px}
/* 成果展示 */
.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;padding:44px 0 26px;align-items:start}
.kick{font-size:13px;color:var(--och);font-weight:700;letter-spacing:.08em}
.stage h1{font-family:var(--serif);font-size:40px;line-height:1.3;font-weight:700;margin:10px 0 14px;letter-spacing:.01em}
.dek{font-size:15.5px;color:var(--ink2);margin:0 0 26px;max-width:28em}
.figs{border-top:1px solid var(--ink)}
.fig{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule)}
.fig b{font-family:var(--serif);font-size:46px;line-height:1;font-weight:700;letter-spacing:-.01em}
.fig b.cur{color:var(--och)}
.fig .u{font-size:14px;color:var(--ink2)}
.fig .l{grid-column:1/-1;font-size:13.5px;color:var(--ink2)}
.fig .l button{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--rule2);text-underline-offset:4px}
.fig .l button:hover{text-decoration-color:var(--och)}
figure{margin:0}
figure .cap{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--rule);padding-top:10px;margin-top:6px}
figure .cap button{border:0;background:none;padding:0;color:var(--och);font-weight:700;white-space:nowrap}
.fhead{font-family:var(--serif);font-size:17px;margin:0 0 4px}
.fsub{font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.next{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid var(--rule);padding:18px 0 40px;font-size:14px;color:var(--ink2)}
.next button{border:1px solid var(--ink);background:none;padding:9px 16px;font-weight:700;color:var(--ink)}
.next button:hover{background:var(--ink);color:var(--bg)}
/* 年度比較：小倍數 */
.yhead{padding:34px 0 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.yhead h1{font-family:var(--serif);font-size:32px;margin:6px 0 0;line-height:1.3}
.key{display:flex;gap:18px;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.key i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.grp{font-family:var(--serif);font-size:19px;margin:30px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.grp small{font-family:var(--sans);font-size:12.5px;color:var(--ink3)}
.mult{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:40px}
.sm{padding:16px 0 18px;border-bottom:1px solid var(--rule)}
.sm h3{margin:0;font-family:var(--serif);font-size:16.5px;line-height:1.45;font-weight:700}
.sm h3 button{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
.sm h3 button:hover{color:var(--och)}
.sm .u{font-size:12.5px;color:var(--ink3)}
.sm .chg{font-size:13px;color:var(--ink2);margin-top:2px}
/* 全部指標 */
.ihead{padding:34px 0 14px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.ihead h1{font-family:var(--serif);font-size:32px;margin:6px 0 0}
.srch{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.srch input{border:0;border-bottom:2px solid var(--ink);background:transparent;padding:6px 2px;font-size:17px;width:340px;max-width:100%}
.srch select{background:transparent;border:0;border-bottom:1px solid var(--rule2);padding:5px 2px}
.idx{columns:2;column-gap:56px;padding-bottom:40px}
.icat{break-inside:avoid;margin:0 0 22px}
.icat h2{font-family:var(--serif);font-size:18px;margin:0 0 4px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.irow{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px dotted var(--rule2);font-size:14px}
.irow button{border:0;background:none;padding:0;text-align:left;color:var(--ink);flex:1;min-width:0}
.irow button:hover{color:var(--och)}
.irow .v{white-space:nowrap;font-weight:700}
.irow .v small{font-weight:400;color:var(--ink3);margin-left:6px;font-size:12px}
.faint{color:var(--ink3)}
.view[hidden]{display:none}
/* 來源視窗 */
.ovl{position:fixed;inset:0;background:rgba(23,58,46,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.ovl.on{display:flex}
.ovl .box{background:var(--bg);width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.22)}
.ovl .hd{position:sticky;top:0;background:var(--bg);padding:18px 24px 12px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;gap:12px;z-index:2}
.ovl .hd h3{margin:0;font-family:var(--serif);font-size:20px}
.ovl .bd{padding:12px 24px 24px}
.ovl .x{border:1px solid var(--rule2);background:transparent;height:32px;padding:0 12px;flex:none;font-weight:700;white-space:nowrap}
.srow{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.srow .yr{font-family:var(--serif);font-weight:700;font-size:14px}
.srow.cur{background:var(--och-l);margin:0 -10px;padding:10px;border-bottom:0}
.quote{border-left:3px solid var(--och);padding:4px 10px;margin:4px 0 2px;font-size:13.5px;font-family:var(--serif)}
.kv{font-size:12.5px;color:var(--ink2)}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border:1px solid var(--rule2);color:var(--ink2)}
.srcbtn{border:0;background:none;padding:0;color:var(--och);text-decoration:underline;font-size:12.5px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;z-index:200;display:none;max-width:300px;line-height:1.45}
.alltb{width:100%;border-collapse:collapse;font-size:13px}.alltb th,.alltb td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left}

.role{display:inline-block;font-size:11.5px;font-weight:700;color:#7A3D14;background:#F6E6D8;padding:1px 7px;margin-right:8px;vertical-align:2px;white-space:nowrap}
.means{font-size:13.5px;color:var(--ink2);margin:4px 0 0;line-height:1.6}
.more{border:0;background:none;padding:0;color:var(--och);font-weight:700;font-size:13px;white-space:nowrap}
.more:hover{text-decoration:underline;text-underline-offset:4px}
.fig .row2{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.fig .sec2{font-size:13px;color:var(--ink2)}
.back{border:0;background:none;padding:0;color:var(--ink2);font-size:13.5px;margin-bottom:6px}
.back:hover{color:var(--ink)}
.navhint{font-size:12px;color:var(--ink3);padding-top:17px;white-space:nowrap;align-self:flex-start;margin-right:-10px}
.sepw{display:flex;gap:14px;flex-wrap:wrap;padding:18px 0 8px}
.sepw div{flex:1;min-width:120px;border-top:3px solid #CFC4B0;padding:10px 2px 0}
.sepw span{display:block;font-size:12.5px;color:var(--ink3)}.sepw b{font-family:var(--serif);font-size:34px;line-height:1.2}.sepw em{font-style:normal;font-size:13px;color:var(--ink2);margin-left:4px}
.sm .sepw b{font-size:20px}.sm .sepw{padding:8px 0 2px;gap:8px}.sm .sepw div{min-width:80px}.sm .sepw span{font-size:11.5px}
.warn{font-size:12.5px;color:#7A3D14;margin:6px 0 0}
.cap2{font-size:12.5px;color:var(--ink3);margin:6px 0 0}
.sm h3 button span{font-family:var(--sans);font-size:12px;color:var(--och);font-weight:700;margin-left:4px;white-space:nowrap}
.irow .go{color:var(--och);font-weight:700;font-size:13px}
:focus-visible{outline:3px solid #B5602A;outline-offset:2px}
@media(max-width:1000px){.stage{grid-template-columns:1fr;gap:28px}.mult{grid-template-columns:repeat(2,minmax(0,1fr))}.idx{columns:1}}
@media(max-width:640px){
 .wrap{padding:0 16px}
 .mast .r1{flex-wrap:wrap;gap:10px;padding:14px 0 8px}.mast .brand{font-size:19px}.mast .brand small{display:block;margin:2px 0 0}
 .modes{gap:16px;order:3;width:100%}.modes button{font-size:14px}
 .themes{gap:20px}.themes button{font-size:17px}
 .stage{padding:24px 0 16px}.stage h1{font-size:28px}.fig b{font-size:36px}
 .mult{grid-template-columns:1fr}.yhead h1,.ihead h1{font-size:25px}
 .srch input{width:100%}.next{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:no-preference){.stage,.mult{animation:in .35s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}

main.m{padding:0}
.rooms{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border-top:1px solid var(--rule);margin-top:4px}

.vd{display:flex;flex-direction:column;gap:14px}

.vdr em{font-style:normal;font-family:var(--serif);font-size:18px;font-weight:700;color:#F6F2EA}.vdr.c em{color:#E7A46D}
.below{padding-top:18px;padding-bottom:30px}
.funds{border-bottom:1px solid var(--rule);padding-bottom:12px}.fnote{font-size:12px;color:var(--ink3);margin:2px 0 0}

.fund .tg{font-size:12px;font-weight:700;color:var(--ink);border:1px solid var(--rule2);padding:1px 7px}
/* 第十二輪：全域搜尋 */
.gs{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 0 12px}
.gs>label{font-weight:700;font-size:14px}

.gclr{border:1px solid var(--rule2);background:#fff;border-radius:4px;padding:0 10px;font-size:13px;white-space:nowrap}
.gqh{font-size:12px;color:var(--ink3)}

.gr{border:1px solid var(--rule);background:#fff;padding:9px 11px}

: {"v4": 91.96, "v5": 91.47, "v6": 90.17, "v7": 90.89, "v8": 91.91, "v9": 90.52, "v10": 90.7}}, {"n": "農業發展基金", "ach": {"v4": 0.36, "v5": 0.52, "v6": 10.5, "v7": 78.44, "v8": 56.68, "v9": 67.72, "v10": 75.4}, "exe": {"v4": 0.48, "v5": 0.69, "v6": 11.97, "v7": 89.36, "v8": 64.57, "v9": 67.74, "v10": 75.43}}, {"n": "丹娜絲及0728豪雨災後復原重建", "ach": {"v4": 33.07, "v5": 42.39, "v6": 49.64, "v7": 58.27, "v8": 64.72, "v9": 70.83, "v10": 76.13}, "exe": {"v4": 72.52, "v5": 74.99, "v6": 79.46, "v7": 84.22, "v8": 84.7, "v9": 92.69, "v10": 82.89}}], "NEWSMAP": {"v1": "115年1月", "v2": "115年2月", "v3": "115年3月", "v4": "115年4月", "v5": "115年5月", "v6": "115年6月", "v7": "115年7月", "v8": "115年8月", "v9": "115年9月", "v10": "115年10月"}, "NEWS": [{"m": "115年10月", "n": 3, "items": [{"s": "白河水庫旁大片樹木遭砍！環團疑濫墾 南市府：僅除草未整地", "a": "環保團體30日召開記者會指控有業者於白河水庫自來水水質水量保護區及特定水土保持區濫墾濫伐，甚至清除植被樹木、清出道路等，質疑台南市政府未依《水土保持法》等規定開罰；台南市政府及農業部水土保持署官員回覆稱，經查現場僅為除草，並未有開挖整地等行為，符合水保法規定，已要求業者應恢復植生環境。", "u": "坡地管理組", "d": "2026/10/30", "st": "存參", "p": "坡地管理組於115.10.30回應。", "k": "一、依水保法第12條規定，於山坡地從事開發利用行為，水保義務人應先擬具水保計畫送主管機關審核，違反者，依同法第33條規定裁處6-30萬元，另依水保法第35條、同法施行細則第38條與依水保審監辦法第5條規定，其違規查報、取締、制止及書件審核係地方政府權責。\n二、本案經洽臺南市政府，涉案地號(共17筆土地)涉及違反水土保持法共計裁罰33萬元，部分地號(223-1地號等8筆及94-22、94-23共10筆土地)經市府會同服務團現勘認屬除草行為未有開挖整地情形，無違反水土保持法情事，並已要求業者儘速恢復植生。\n三、應辦事項：本案違規查處及書件審核係屬地方政府權責，本署將督導地方政府依法查處，本組將持續掌握相關輿情訊息並即時回應；後續並依115年10月30日記者會決議，俟陳昭姿立委安排現地會勘及本次會議紀錄來文後辦理。"}, {"s": "白河水庫保護區再爆整地！環團疑為蓋廟留路 市府8日會勘", "a": "台南白河水庫水源保護區再爆整地爭議。環團7日前往關子嶺現勘，發現94-22、94-23地號有地主自行整地，林姓地主稱土地長期遭亂丟垃圾才動工；環團質疑，當地過去已有大面積整地爭議，如今又整理出道路，是否為未來興建廟宇預留通路，要求市府查明。", "u": "坡地管理組", "d": "2026/10/07", "st": "存參", "p": "坡地管理組於115.10.7回應。", "k": "一、依水保法第12條規定，於山坡地從事開發利用行為，水保義務人應先擬具水保計畫送主管機關審核，違反者，依同法第33條規定裁處6-30萬元，另依水保法第35條、同法施行細則第38條規定，其違規查報、取締及制止係地方政府權責。\n二、本案經洽臺南市政府表示，該府農業局核定委由白河區公所辦理之排水溝改善工程位於臺南市白河區關子嶺段94-7地號，已於8/14開工並預計於10/12完工，經該府水利局現勘認定屬集水區治理行為，尚無違反水保法情事。\n三、另該府水利局10/1巡查發現鄰近之94-22及94-23地號疑似有違規開挖整地行為，已於10/2通知水保義務人於10/8進行會勘，如有違反水保法情事將依法辦理。\n四、應辦事項：違反水保法之查處係屬地方政府權責，本組將持續掌握相關輿情訊息並即時回應。"}, {"s": "南亞科落腳屏東 張麗善批土地卡關；雲縣府質疑中央雙標 農地變更卡關 相較南高屏一路綠燈", "a": "台塑集團DRAM大廠南亞科擴廠計畫1日正式落腳屏東，但長期爭取南亞科設廠的雲林縣長張麗善，先在上午喊話中央，若決定南亞科落腳屏東，對整個區域發展而言，並不是一個理想的決定；下午她更發表聲明釐清土地等問題，直指中央到底是什麼考量？應該讓地方及企業瞭解真正的原因。", "u": "農村規劃組", "d": "2026/10/02", "st": "存參", "p": "農村規劃組於115.10.2回應", "k": "一、雲林縣政府規劃園區定位不明：本區開發29公頃產業園區或擴大為250公頃科學園區，其開發方式、土地條件、產業鏈結構完整性須全盤考量。因本區國科會已表示本區暫無開發科學園區之條件及計畫，對於開發為記憶體產業園區，仍需由經濟部報請行政院認定為重大投資案或重大建設予以支持。\n二、優良農業生產環境之開發尚有諸多疑慮待釐清：本案計畫範圍周邊為特定農業區農業用地，又鄰近馬光有機集團栽培區，亦為高鐵沿線地層下陷地區之監控範圍，對產業園區之開發，已多次請雲林縣政府就農變說明書相關疑義補充，惟該府仍尚完整說明，包括產業定位不明、園區用水恐排擠農業用水、地下水質監控機制不足、產業再生水使用率過低、既有農民及社區居民提出環境安全等反對疑慮，爰本部已於115年9月17日第六步函請經濟部輔導雲林縣政府補正。"}]}, {"m": "115年9月", "n": 2, "items": [{"s": "台東多良部落野溪整治 工人躺在大車視線死角午睡遭輾斃", "a": "台東太麻里鄉多良部落野溪整治工程，傳出死亡意外，一名男性板模工人，疑似中午吃完飯後，躺在疏濬工地臨時便道旁午睡小憩，不料，有一輛水泥預拌車正要進場，疑因躺在大車視線死角，工人當場被輾斃。", "u": "臺東分署", "d": "115/09/30", "st": "存參", "p": "臺東分署於115.9.30回應。", "k": "本(30)日自由時報等報報導「台東多良部落野溪整治 工人躺在大車視線死角午睡遭輾斃」說明如下：\n一、本案為本署臺東分署辦理「台東縣LL008多良部落坑溝土砂災害處理二期工程」 。\n二、本事件於9月30日13時左右，模板工人杜正松於路邊樹蔭下休息，位混凝土車視線死角，導致該車爬坡壓過，不幸身亡，警察及救護人員於13時20分抵達封鎖現場。\n三、臺東分署於14時01分線上通報勞動部職安署南區中心並予事發後，依職安法第37條規定全面停工，並依重大事故處理標準作業書填報本署重大緊急事件通報單。\n四、臺東分署將全力協助家屬處理後續後事事宜，爭取保險、致送喪葬金等；後續儘速召開工程事故檢討會議，並請監造、承包商依會議決議妥處相關勞安措施。"}, {"s": "傳南亞科轉進屏東 張麗善批選舉考量 劉建國抨擊雲林沒搞定土地 縣府反擊卡在農業部", "a": "台塑集團南亞科先前傳出可能落腳「雲林虎尾產業園區」與「屏東科學園區」，近日有消息指國科會預計10月1日拍板捨雲林選屏東，關鍵是半導體廠命脈「水資源」。雲林縣長張麗善28日強調雲林「不缺水、不缺電」，若是短暫性選舉考量，這對整個台灣的發展是不正常、不良示範，還是要尊重企業、尊重專業，「綜觀可見，屏東的周春米比雲林的劉建國重要」。", "u": "農村規劃組", "d": "115/09/29", "st": "存參", "p": "農村規劃組於115.9.29回應。", "k": "一、雲林縣政府規劃虎尾產業園區之園區定位不明：\n雲林縣政府擬於本區開發29公頃產業園區，後續將擴大為250公頃之科學園區。惟產業園區及科學園區之開發方式及土地規劃條件皆不同，對於產業鏈建構與完整性須全盤考量，故該區之開發規模與定位，尚須由中央目的事業主管機關(經濟部或科技部)釐清。\n二、請經濟部釐清開發方式專案報院：本案經濟部倘擬朝開發記憶體產業園區以扶持記憶體產業發展為目標，本部已建議經濟部評估是否輔導雲林縣政府或自行主導，將本案報請行政院認定為重大投資案或重大建設予以支持。\n三、周遭農業生產環境優良，園區開發尚有諸多疑慮：本案計畫範圍周邊多為特定農業區農業用地，鄰近馬光有機集團栽培區，對本案後續開發，雲林縣政府所送農變說明書內容尚有諸多疑慮未釐清，包括產業定位未明、園區用水恐排擠農業用水、地下水污水監控機制不足、產業再生水使用率宜提高、居住交通安全、既有農民及社區居民提出反對之意見等疑慮，爰本部已於115年9月17日函請經濟部輔導雲林縣政府補正。"}]}, {"m": "115年1月", "n": 7, "items": [{"s": "土方之亂", "a": "1.解土方之亂政院提3策略 建置公有暫置場年前啟用\n2.中部區域聯防 土方之亂有解\n3.土方填築港區 蘇俊賓：應調查水文影響\n4.土方擬大量開放港區填築 蘇俊賓：盡早部署生態調查\n5.免費回填的真相：什麼土能進農地？ 釐清土方管理，民間呼籲立專法", "u": "農村規劃組", "d": "115/01/30", "st": "存參", "p": "農村規劃組於115.1.30回應", "k": "一、有關農地改良填土土質已明定於農業發展條例施行細則第2條之1，即農業用地為從事農業使用而有填土需要者，其填土土質應為適合種植農作物之土壤，不得為砂、石、磚、瓦、混凝土塊、營建剩餘土石方、廢棄物或其他不適合種植農作物之物質，並不因土地所在區位等因素而有不同。\n二、農業部已於115年1月20日澄清，並於115年1月26重申，基於營建剩餘土石方內含物質是否安全，仍有疑慮，故現行政策方向及規定沒有改變，亦無規劃放寬前開施行細則第2條之1相關規定，即非屬適合種植農作物之物質，均不得以改良名義回填於農地，以確保農業生產環境安全。\n三、另土壤為天然化育而成，農業生產自以原生土壤為佳，應無農地須大量填埋外來物質以進行改良之情形，且農地整地行為應以挖填平衡為原則，故農地改良與營建剩餘土石方去化無關，係為二事，不宜混為一談。"}, {"s": "警方揭露西湖鄉違法開發3公頃山坡地 苗縣府依水保法重罰30萬元", "a": "苗栗縣道128線旁西湖鄉高埔段約3公頃山坡地，地主違法未經申請即開挖，並回填一般土石方，警方通報縣府今天查獲，除勒令停工，縣府將依水土保持法最重30萬元裁罰，並連續處分至改正，並限期恢復植生。", "u": "坡地管理組", "d": "115/01/27", "st": "存參", "p": "坡地管理組於115.1.27回應。", "k": "一、於山坡地從事開發行為，應依水保法第12條規定擬具水保計畫送審後實施；另依同第35條及其施行細則第38條規定，違規查報、制止及取締，係苗栗縣政府(下稱縣府)權責。\n二、經洽縣府瞭解，相關處理作為如下：\n(1)案地位於苗栗縣西湖鄉新高埔段2211-20、1122-23、2211-18、2211-22、2211-19、2211-17、2211-16、2418地號等8筆土地，縣府於115.1.26接獲警方通報立即前往現勘，確認未經申請擅自開挖整地，並堆置大量來源不明的土方，違規面積約2.9221公頃。\n(2)縣府已勒令現場停工，並將依水保法裁罰30萬元，後續將嚴格要求水土保持義務人限期3個月恢復植生，倘屆期未改正，將連續處分至改正為止。\n三、經查本署衛星影像變異點監測，本案115.1.10與前期影像比對尚無變異情形，故應屬近期違規行為，將循違規處理既有通報機制，於今（27）日函請該府積極辦理，並以系統列管追蹤辦理情形至結案。\n四、應辦事項：本案違反水保法之查報取締係屬地方政府權責，本組將持續掌握相關輿情訊息並及時回應。"}, {"s": "「廢弛職務、卸責地方」花蓮縣府揭洪災內幕 要檢調查辦行政院", "a": "去年9月23日發生花蓮馬太鞍溪堰塞湖災害，據「鏡周刊」報導，偵辦層級或上升到花蓮縣長徐榛蔚，朝向廢弛職務釀成災害偵辦。花蓮縣政府今提出10重點，嚴正質疑中央廢弛職務、卸責地方，籲檢調依法一視同仁查辦行政院。", "u": "減災監測組", "d": "115/01/27", "st": "存參", "p": "減災監測組於115.1.27回應。", "k": "一、堰塞湖致災型態與規模，屬「低頻高衝擊」之災害，相較土石流、大規模崩塌等災害，堰塞湖具有以下特性：\n（一）發生頻率低、但單一事件影響範圍大，潰決後可能影響整個流域中下游。\n（二）致災時間具高度不確定性，可能長期存在後才發生溢流或潰決等「非即時致災、延遲性高風險」的特性。\n（三）發生後不一定以工程處置，因地制宜結合自然消散、長期監測與生態考量。\n此類型災害無法直接套用既有土石流或大規模崩塌既有的警戒發布、避難啟動與常時演練制度，據此，在堰塞湖尚未成為法定災害前，其防災相關作業應依行政院農業委員會101年7月4日農林務字第1011730362號函修訂之「堰塞湖警戒、監測及撤離與演練方案」據以執行為宜。其中分工明訂：堰塞湖之警戒、監測由權責機關負責，撤離地點之擇定與演練等由地方負責，並由中央協助指導。\n二、考量堰塞湖屬「低頻高衝擊」之災害，部份整備工作地方政府參考「農業部土石流及大規模崩塌防災疏散避難作業規定」之成果以利防災工作推動，本署尊重其做法。惟前開規定有關防災整備工作分工，中央係以警戒發布為主；避難收容處所選定及整備、規劃疏散路線、保全住戶名冊建置及疏散人員編組係以地方政府為主體，中央為輔導及支援之角色。"}, {"s": "聯合報記者李柏毅採訪", "a": "採訪內容：何謂農地改良，以及營建剩餘土石方回填農地事宜?", "u": "農村規劃組", "d": "115/01/20", "st": "存參", "p": "農村規劃組蔡秀婉組長於115.1.20回應。", "k": "一、農地改良，係農地若有地勢低漥不利耕作、土質不佳或土壤肥力不足影響產量情形，會透過填適合耕作的土壤，改善土壤深度、土壤質地或有機質含量等情形，以改善農耕環境，提高農地生產力。\n二、如何證明農地改良填的是「適合耕作的土壤」，填的土方，申請人須向縣市政府申請，且須檢具合格土資場出具證明文件，並經檢驗合格，排除有重金屬或有毒物質等情形，並予佐證後，始得回填。此外，農地改良填土需考量高度，不得高於鄰田或影響毗鄰農田灌排水系統。\n三、因農地改良填入的土方量及土壤質地，會因區域或土壤現況之特性而有不同，現行農地改良之受理機關為縣市政府，目前多數縣市政府都有農地改良之申請及審查操作機制。\n四、由於營建剩餘土石方參雜物質非常多，非屬適合耕種之土方，不可以逕回填農業用地，目前農業部亦無修正農業發展條例施行細則第2條之1規定之情形。"}, {"s": "苗栗南莊山林遭非法濫墾！邊坡切削呈直角恐崩塌", "a": "苗栗縣南莊鄉西村一處山林地近日被民眾發現疑遭人為濫墾，邊坡遭大幅切削、道路幾近呈直角，開挖面積約達數座籃球場，引發地方關切。苗栗縣政府今(16)日說明，本案已在月初由南莊鄉公所第一時間巡查通報後查處。", "u": "坡地管理組", "d": "115/01/17", "st": "存參", "p": "坡地管理組於115.1.17回應。", "k": "一、權責：本案山坡地違規擅自開發之查報、制止及取締，係苗栗縣政府權責，依水保法規定可裁處6-30萬元、限期改正，如致生水土流失、竊占等移送法辦。\n二、查處：案地位於苗栗縣南庄鄉桌山段20-41地號及大屋坑小段35地號，縣府前於115.1.7現勘，確認擅自開挖整地(約1,500~1,600平方公尺)，因部分屬林保署新竹分署管理土地，故將釐清行為人(義務人)及土地合法使用權(是否竊占)等，會同水保服務團確認違規事實(含評估是否致生水土流失)，續依水保法相關規定積極辦理。\n三、督導：本署已比對115.1.3與114.12.24前後期衛星影像，判釋該土地確有變異情形，將循變異點既有通報機制及系統列管，並追縱辦理情形至結案。"}, {"s": "4座籃球場山林被剷光！南莊道路邊坡裸露 國有地也遭殃", "a": "苗栗縣議員陳光軒獲報，南庄鄉西村一處山林地，遭人為濫墾；他今（15）日前往驚見翠綠山林成光禿禿一片，要求縣府依法嚴格處罰。縣府水利處表示，縣府已於2週前接獲檢舉，並隨即展開查處作為，經查違規面積約1500到1600平方公尺，換算約4座籃球場大小，當中並有涉及國有地，已通知地主明天到縣府說明，後續依法追究相關責任。縣府並提醒民眾若於山坡地或森林區內從事整地等相關行為，請依規定申請水土保持計畫。", "u": "坡地管理組", "d": "115/01/15", "st": "存參", "p": "坡地管理組於115.1.15日回應", "k": "一、於山坡地從事開發行為，應依水保法第12條規定擬具水保計畫送審後實施；另依同第35條及其施行細則第38條規定，違規查報、制止及取締，係苗栗縣政府(下稱縣府)權責。\n二、經洽縣府瞭解，相關處理作為如下：\n(1)案地位於苗栗縣南庄鄉桌山段20-41地號及大屋坑小段35地號等土地，前於115年1月7日辦理現勘，確認遭人擅自開挖整地，違規面積約1,500~1,600平方公尺，且部分屬林保署新竹分署管理之國有土地，涉及違反水保法第12條及第32條規定，惟土地所有權人未到場。\n(2)縣府再訂於1月16日請土地所有權人到府說明，以釐清行為人以及是否有取得土地合法使用權等事項；並另請水保服務團專業技師，協助評估有無致生水土流失之情形，相關結果將納入違規處理之參據。\n(3)縣府表示，本案俟違規行為人等事項釐清後，即依水保法規定辦理，並要求限期改正，以確保安全。\n三、應辦事項：本案違反水保法之查報取締係屬地方政府權責，本組將持續掌握相關輿情訊息並及時回應。"}, {"s": "協調中央全力支援古坑草嶺森林火警 劉建國：確保救災安全優先", "a": "已燒毀約5公頃林地，雲林縣古坑鄉草嶺地區發生森林火警，起火地點位於石壁大飯店後方山區。由於當地地形陡峭、林相密集，加上目前正值冬季乾燥季節，增加火勢延燒與救災作業的困難度。立法委員劉建國表示，消防單位接獲通報後即投入搶救行動，並出動多輛消防車及人力進入山區救援。火勢於12日下午一度獲得控制，但因山區缺乏水源、地勢險峻，今日仍持續投入人力警戒與撲滅殘火。", "u": "南投分署", "d": "115/01/13", "st": "存參", "p": "南投分署於115.1.13回應。", "k": "一、聯繫雲林縣古坑鄉草嶺村陳兵通村長，表示起火位置在木馬古道下方坡面，暫時不影響農村聚落，目前雲林縣消防局已控制住火燒範圍。\n二、並電洽嘉義林保署，表示經查火警地點屬於雲林縣政府的公有地，今（13）日中午應縣府需求，林保署已派轄內奮起湖工作站2名人員至現場協助。\n三、有關火災影響範圍包含有雲林縣政府近年推動「草嶺石壁森林療癒基地」，本署未來會視草嶺、石壁社區及石壁休閒農業區需求，給予辦理後續相關協助。"}]}, {"m": "115年2月", "n": 2, "items": [{"s": "特定工廠合法化 經部月底函釋標準", "a": "全國上千家位於農產業群聚地區的特定工廠，在申請用地變更合法化過程中，竟因「限以隔離綠帶規劃」規定如何並行，中央與地方對法規解讀不同，審查進度受阻。經濟部產業發展署承諾，將於二月底前發函釋示，統一全國審查標準。", "u": "農村規劃組", "d": "115/02/12", "st": "存參", "p": "農村規劃組於115.2.12回應。", "k": "一、依農業主管機關同意農業用地變更使用審查作業要點規定，農業用地變更使用應至少留設一、5公尺且面積不少於申請面積30%之隔離綠帶或隔離設施，且得為通路等非建築之開放性設施。故農業用地變更廠房之出入口，倘以隔離設施方式設置，尚無牴觸農變要點之規定。\n二、本案爭議係因經濟部主管之「特定工廠申請變更編定為特定目的事業用地審查辦法」第6條規定，申請特定工廠之土地，位於農產業群聚地區者，與相鄰農業用地限以隔離綠帶規劃，爰造成特定工廠廠區出入口應如何設置規劃產生疑義。\n三、本案前經經濟部於1月30日邀集相關單位進行會議研商，並有研商共識：對於位於農產業群聚地區之特定工廠，如係配合建築法規就出入口通行範圍，有適當之舖築，尚不違反特定工廠用地辦法規定；其為通案性之處理，後續由經濟部以通函解釋。故昨日協調會，經濟部允諾2月底完成通函解釋。"}, {"s": "公共電視台記者李婕綾採訪", "a": "採訪內容：土石流防災專員的參加資格、培訓、工作內容，有哪些不同的挑戰及未來農村水保署的規劃。", "u": "減災監測組", "d": "115/02/05", "st": "存參", "p": "減災監測組陳振宇組長於115.2.5回應。", "k": "一、說明為強化地方社區自主防災能力，本署辦理招募並培訓土石流防災專員，就參與培訓的資格及培訓時課程等內容解說，以及介紹土石流防災專員平時及災時在不同時間所需執行之任務的差異。\n二、於採訪中其述說土石流防災專員帶來的防災量能及本署後續精進作為，積極透過多元招募優化組成結構，並鼓勵女性、青年及新住民擔任土石流防災專員，並說明過去及現在土石流防災專員的挑戰，以及本署對於土石流防災專員未來之展望。\n三、應辦事項：將關注採訪播出內容。"}]}, {"m": "115年3月", "n": 2, "items": [{"s": "桃園大溪康莊百年埤塘生態危機：水路遭割裂，金牌農村食農教育典範恐蒙塵", "a": "位於桃園市大溪區康莊休閒農業區內的金牌農村，一口承載百年歷史的埤塘，不僅是地景記憶，更是維繫區域農業生態、支撐\"食農教育\"國家典範的核心命脈。近日，這口埤塘及其周邊公共通道，因土地產權變更與不當分割，面臨水路、路網遭人為割裂封鎖的危機，不僅衝擊農業生產基礎，更危及得來不易的一級生態與食農教育發展成果。", "u": "臺北分署", "d": "115/03/23", "st": "存參", "p": "臺北分署於115.3.23回應。", "k": "一、經詢問地方人士，該埤塘因土地產權分割的問題，造成2地主間產生嫌隙。\n二、文中所述，新地主以土地私有為由，開始進行以下行為:「區隔水路，破壞灌溉系統」、「封路縮道，妨礙公共通行」。據悉，該埤塘近年來早已乾涸無水，係因埤塘上游水源自遠處流下，途經諸多用戶截水使用，致使埤塘水源日漸枯竭。另地主在埤塘外圍路口設置阻隔設施，為阻擋對方車輛進入，但行人仍可通行。\n三、文中所述:「分署特別在此投資興建觀景平臺與食農教育場域」、「食農教育根基動搖，生產環境與教育場域被硬生生割裂」。分署所施設的平台並未位於係爭土地上，社區平時經常性辦理生態體驗及導覽活動，該埤塘入口雖經地主設置阻隔設施，但行人仍可通行，亦有其他路線可繞行，且解說平台仍可供公眾使用，對社區導覽活動不致有影響。\n四、地方人士已持續溝通協調中，盼以社區共好為前提，給予社區居民方便通行及使用，惟仍需要時間溝通協商。"}, {"s": "南投名間焚化爐選址爭議 環團籲停止二階環評並改址", "a": "（中央社記者汪淑芬台北10日電）監督施政聯盟今天舉行記者會，指名間焚化爐案選址程序未完備，距預定地一、5公里處有淨水場，恐汙染飲用水源，呼籲應停止二階環評並重新選址。", "u": "農村規劃組", "d": "115/03/11", "st": "存參", "p": "農村規劃組於115.3.11回應。", "k": "一、名間鄉為國內商用茶之主要產區(約2,218公頃)，占南投縣茶產量之1/2，亦占全國茶產量之1/3。其中取得茶產業產銷履歷驗證70公頃、有機驗證面積33公頃。此外，鄉內農產業多元，除有稻米產銷契作集團產區外，當地亦種植山藥、米、鳳梨等其他果樹，通過產銷履歷驗證總面積167公頃。由於農業為當地唯一產業，焚化廠設置倘有影響周邊農業及茶葉生產環境，將影響當地農民生計。由於特定農業區仍應優先以農業使用為主，縣府仍有興建焚化廠需求，建議應另覓其他適當場地設置。\n二、本案倘仍擬變更特定農業區設置，因本案屬應送中央區域計畫擬定機關審議之案件，依農變要點第13點第1項第1款規定，須由環境部收到縣府提報之農變說明書，並提出使用農地之必要性、合理性及無可替代性之支持意見，再徵詢農業部意見。\n三、由於當地自救會多次陳情焚化爐之設置，落塵影響當地茶園及果園安全、聯外道路寬度不足影響當地交通安全等議題，抗議聲浪嚴重，仍應請南投縣政府查明，並持續與當地居民溝通，以避免本案開發影響當地農民權益。\n四、本案環境部倘未針對本案使用特定農業區之必要性、合理性及無可替代性提出評估意見，並具體表示支持，依據農變要點第4點，原則不同意變更使用。"}]}, {"m": "115年4月", "n": 10, "items": [{"s": "公地放領 立委陳瑩：山坡地認定僵化應檢討", "a": "（中央社記者盧太城台東縣29日電）內政部宣佈重啟公地放領，山坡地遭排除。立委陳瑩表示，山坡地認定僵化，應檢討並回歸實際使用情形；早期土地管理機關移轉影響申請人權益，應建立一致、合理的審議標準。", "u": "坡地管理組", "d": "115/04/29", "st": "存參", "p": "坡地管理組於115.4.29回應。", "k": "一、依水土保持法第3條第3款規定，係指國有林事業區、試驗用林地、保安林地，及經中央或直轄市主管機關參照自然形勢、行政區域或保育、利用之需要，就標高在100公尺以上或標高未滿一百公尺，而其平均坡度在百分之五以上者劃定範圍，報請行政院核定公告之公、私有土地。\n二、為檢討山坡地範圍之劃定標準，改制前行政院農業委員會101.4.24召開專家會議研商其妥適性，會中取得共識，山坡地範圍之劃定標準係依臺灣地形環境及防災需求所建立，現階段尚無全面修訂之必要。\n三、為因應地籍重測等原因，改制前行政院農業委員會於108年至111年完成各縣市山坡地範圍通盤檢討，後續各縣市如有檢討之需求，仍可依「農業部山坡地範圍劃定及檢討變更作業要點」規定，辦理個案檢討，但須符合水土保持及安全條件下，審慎評估調整可能性，以兼顧地方發展與土地權益。"}, {"s": "《逾250位學者專家連署 呼籲停止興建名間焚化爐計畫 守住茶鄉農業經濟與文化資產》", "a": "超過250位，來自海內外各大專院校系所，及研究機構的學者專家，提出反對設置焚化爐的論點，籲請南投縣政府即刻終止缺乏社會共識的環評程序。", "u": "本署", "d": "115/04/24", "st": "存參", "p": "本署於115.4.24回應。", "k": "一、本次會議無立法委員出席，亦未邀請各行政機關列席，農村水保署依據記者會直播及書面資料，彙整主要訴求摘述如下：\n1.焚化爐設置將威脅國家糧食安全與特定農業區完整性，請南投縣政府重新審視此項決策。\n2.名間鄉為全台規模最大之茶產區，更為臺灣手搖文化重要的本土基底茶共應鏈，南投縣政府應守護百億產值與台灣手搖飲文化資產。\n3.為捍衛程序正義與環境韌性，請南投縣政府積極研議更具環境友善性，符合循環經濟原則的垃圾處理永續治理方案。\n二、本次記者會訴求主題，無涉農業部業務，惟後續仍持續關注南投焚化爐案相關議題，並適時回應及處理。"}, {"s": "農村再生「產業活化」補助遭暫緩？ 農村水保署：資源重新配置 各縣市皆同", "a": "雲林縣日昨舉辦「115年農村再生執行計畫修正說明會」，提及中央政策調整導致產業活化補助暫緩，縣府將自籌2,760萬元預算持續推動。農業部農村發展及水土保持署今（17）日澄清，相關措施並非停止或取消補助，而是調整「產業活化類」計畫推動方式，改由農村水保署各分署統籌規劃，避免資源重複投入或零散執行，這類計畫經費調整所有縣市皆同，不獨虧雲林縣。", "u": "農村建設組", "d": "115/04/18", "st": "存參", "p": "農村建設組於115.4.18回應。", "k": "一、本件為本署電話受訪之澄清報導。\n二、有關產業活化類計畫即是社區產業的推廣與行銷，內容可包括規劃設計與行銷推廣，透過產業活化類計畫，促進社區產業活化與發展。此類計畫補助並未停止，本署希望進行階段性盤點與執行方式精進。考量各社區發展條件不同，若由單一社區各自提案，較難整合產業特色與串聯行銷資源；因此，改由各分署從區域整體角度進行統籌規劃，串聯鄰近社區、青年、實體場域與產業資源，期透過集中投入與整體設計，提升發展效益與成果能見度。\n三、因屬於延續型計畫，依預算法可先行辦理，本署於核定公文內皆會帶到「115年度基金預算尚未經立法院審議通過，屆時如經刪減或凍結，本署得調整計畫金額或配合調整撥款進度。」等文字。"}, {"s": "農傳媒記者採訪案", "a": "農傳媒游昇俯記者採訪於115年4月17日下午5點50分，以電話方式採訪農村建設組陳玲岑組長，採訪內容二大重點：一、產業活動計畫？停止的理由。二、為何立法院還没審預算，我們己核定計書。", "u": "農村建設組", "d": "115/04/17", "st": "存參", "p": "農村建設組陳玲岑組長於115.4.17回應。", "k": "一、因應農村發展型態與資源配置需求，進行階段性盤點與執行方式精進。考量各社區發展條件不同，若由單一社區各自提案，較難整合產業特色與串聯行銷資源；因此，改由農村水保署各分署從區域整體角度進行統籌規劃，串聯鄰近社區、青年、實體場域與產業資源，期透過集中投入與整體設計，提升發展效益與成果能見度。\n二、因屬於延續型計畫，依預算法可以先行辦理，本署於核定公文內皆會帶到「115年度基金預算尚未經立法院審議通過，屆時如經刪減或凍結，本署得調整計畫金額或配合調整撥款進度。」等文字。"}, {"s": "中央暫緩補助！雲林縣府自籌2760萬 接手126案農村再生計畫", "a": "雲林縣政府16日舉辦農村再生計畫修正說明會，將自籌2760萬元補中央缺口。（張朝欣攝）", "u": "農村建設組", "d": "115/04/17", "st": "發新聞稿-澄清", "p": "農村建設組於115.4.17發布【澄清稿】農村水保署持續挹注經費推動農村再生，區域整合避免資源重複投入。", "k": "【澄清稿】農村水保署持續挹注經費推動農村再生，區域整合避免資源重複投入：\n針對昨(16)日雲林縣政府表示「中央政策調整導致產業活化補助暫緩，將自籌經費補足中央缺口」，農業部農村發展及水土保持署澄清表示，相關措施並非停止或取消補助，而是因應農村發展型態與資源配置需求，進行階段性盤點與精進，透過區域整合規劃推動農村社區產業活化與行銷，將可避免資源重複投入或零散執行。\n農村水保持署指出，近3年平均每年投入6.21億元補助農村再生社區，其中補助雲林縣平均計0.82億元，今(115)年將進一步整合社區資源，統籌規劃地方產業活動，以擴大推動成效。\n農村水保署強調，中央對農村社區的預算支持從未中斷，今年度全國22縣市農村再生執行計畫核定補助總金額達5.49億元，共協助411個農村再生社區推動583件涵蓋生活環境與公共設施改善、文化保存與活用、生態保育等軟硬體計畫。其中，針對雲林縣的核定補助金額達4,860萬元，協助雲林縣政府推動轄內73個農村再生社區共計97件軟硬體建設，展現中央持續照顧農村基層需求之決心。\n針對外界關心「產業活化類」計畫之推動方式調整，農村水保署進一步說明，相關措施並非停止或取消補助，而是因應農村發展型態與資源配置需求，進行階段性盤點與執行方式精進。考量各社區發展條件不同，若由單一社區各自提案，較難整合產業特色與串聯行銷資源，因此，改由農村水保署各分署從區域整體角度進行統籌規劃，串聯鄰近社區、青年、實體場域與產業資源，期透過集中投入與整體設計，提升發展效益與成果能見度。\n農村水保署指出，以區域整合規劃來推動農村社區產業活化與行銷，可避免資源重複投入或零散執行，社區在既有基礎上，透過跨域合作，發展更具規模與延續性的產業營運模式。未來此類作法也將優先納入過去已有良好執行成果、地方投入度高的農村再生社區，作為重點示範推動。\n農村水保署重申，中央與地方在農村再生的目標上始終一致，對於雲林縣政府配合中央政策投入經費，農村水保署樂觀其成。未來將持續與各縣市政府及社區聯繫，滾動檢視社區活化推動重點與機制，落實社區組織運作，建構農村支持體系，並在中央與地方協力下，讓農村再生基金發揮最大綜效，落實永續農村願景。"}, {"s": "徐榛蔚赴卓溪鄉石平部落 關心農路復建", "a": "徐榛蔚赴卓溪鄉石平部落 關心農路復建", "u": "花蓮分署", "d": "115/04/15", "st": "存參", "p": "花蓮分署於115.4.15回應。", "k": "一、過去治理概況：位於花縣DF041下游約2.3km，111年曾補助卓溪鄉公所執行「卓溪鄉石平野溪清疏工程」，經費90萬元。\n二、災害復建需求：114年11月鳳凰颱風造成護岸破損斷裂，預計修復護岸長100m，高度6m、路面長50m，路寬3m，固床工3座。\n三、工程提報情形：縣府災後向行政院提報「卓溪鄉石平部落護岸鳳凰風災復建工程」(G1類，提報經費23,088千元)。分署同年12月16日勘審，建議經費為10,725千元，工程會嗣於115年1月15日核定。\n四、後續審查流程：依據「公共設施災後復建工程經費審議及執行作業要點」規定，本案縣府應將基本設計圖說提報本署審查。縣府已於115年4月14日將預算書送達本署審查中。"}, {"s": "土方之亂延燒3個月還在亂...專家曝三大原因 呼籲中央協調配套解方", "a": "中央土方新制今年元旦上路，引爆各縣市「土方之亂」持續延燒。北市結構工程工業技師公會理事長徐茂卿點出三大問題，呼籲中央針對這些問題提解決配套，否則儘管新政立意良善，但民間腳步跟不上。", "u": "農村規劃組", "d": "115/04/12", "st": "存參", "p": "農村規劃組於115.4.12回應", "k": "一、農地土壤係天然化育，農耕行為應適地適種，無大規模回填外來土石之必要。\n二、農地改良係以農業生產使用為目的，由個別農民因其農地為從事農業使用有填土之需要而提出申請，與營建剩餘土石方去化無關，係為二事，不宜混為一談。\n三、農地改良應向地方政府提出申請，填土土質應為適合種植農作物之土壤，不得為砂、石、磚、瓦、混凝土塊、營建剩餘土石方、廢棄物或其他不適合種植農作物之物質，且不因土地所在區位等因素而有不同，以確保整體農業生產環境安全。"}, {"s": "挹注1151萬重建玉里源城溪護岸 徐榛蔚預計4月提送農業部審查", "a": "花蓮縣玉里鎮源城溪因115年樺加沙颱風造成部分河川護岸受損，縣政府今（10）日表示，目前已積極推動重建工程，並已完成設計，將於本月將提送中央審查。花蓮縣長徐榛蔚也親赴玉里鎮現地會勘，確保各項工程設計貼合地方需要，督促團隊加速行政流程，感謝基層地方緊密合作，並冒雨守護家園，目前源城溪經費約為1151萬，預計將於4月提送農業部，待中央核定，力求盡速復健。", "u": "花蓮分署", "d": "115/04/10", "st": "存參", "p": "花蓮分署於115.4.8回應", "k": "一、過去治理概況：本案下游緊鄰土石流潛勢溪流(花縣DF072)，另距離源城國小約1公里，經查為本署91年委辦縣府執行之「源城無尾溪護岸二期」，經費400萬元，竣工後由縣府維管。\n二、災害復建需求：114年9月樺加沙颱風豪雨造成既有護岸毀損2處，長度分別約50m及30m，岸高約3m。後續治理以重新施作護岸、增設並銜接防砂壩，以及一併處理支流坑溝，進行整體性結構補強與流路調整，以恢復河道穩定及保護功能為原則。\n三、工程提報情形：縣府災後向行政院提報「玉里鎮源城溪護岸樺加沙颱風災後復建工程」(G1類，提報經費9,326千元)。本分署同年11月10日勘審，因認定護岸沖毀嚴重，故調整工程內容及數量，建議經費提高為11,510千元，工程會嗣於12月9日核定。\n四、後續審查流程：依據「公共設施災後復建工程經費審議及執行作業要點」規定，本案縣府應將基本設計圖說提報本署審查。俟縣府將預算書送達後再辦理審查。"}, {"s": "假租楊梅農地埋營建廢棄物，非法廢土集團33人起訴", "a": "馬來西亞籍男子林家俊為首的犯罪集團，前年九月起在桃園市假借租地植栽等名義，涉嫌回填營建廢棄物達四萬多立方公尺，不法獲利逾四點二億元，檢方近日偵結，將林男等卅三人、七間公司依廢棄物清理法等罪嫌起訴，並對林求處四年以上徒刑。", "u": "農村規劃組", "d": "115/04/08", "st": "存參", "p": "農村規劃組於115.4.8回應。", "k": "一、農地違規使用，依農發條例第69條規定，應送區域計畫法或都市計畫法主管機關，對違規者處6萬至30萬元罰鍰，並得限期恢復原狀、停止供水、供電、封閉、強制拆除、並得處六個月以下有期徒刑或拘役等措施。\n二、農地遭違法回填廢棄物行為，亦涉及違反事業法規及裁處作業，依「廢棄物清理法」第52條規定，最高處300萬元以下罰鍰；經限期改善而未改善者，得按次處罰。\n三、針對楊梅農地回填營建廢棄物，已由桃園市政府依廢棄物清理法規定裁罰並移送檢調在案，故農地違規回填廢棄物已有相關規範及罰則，如為遏止回填行為，應加強流向及使用管理規範，透過源頭管制方式，強化查察管理機制，以取締違規，並透過裁罰基準，遏止事業廢棄物回填農地。"}, {"s": "雷雨胞強襲苗栗！高鐵停車場變池塘 土石流淹沒山路", "a": "受到鋒面影響，苗栗降下破百大豪雨，現在已經造成多處地方積淹水，苗栗高鐵站附近停車場宛如池塘，山區還有土石流發生。▲苗栗高鐵站旁停車場淹水如池塘。（圖/翻攝Threads）", "u": "減災監測組", "d": "115/04/04", "st": "存參", "p": "減災監測組於115.4.4回應。", "k": "一、受到鋒面影響，造成苗栗高鐵站附近停車場淹水，另苗栗縣南庄鄉 124乙縣道也出現土石崩落情況。\n二、有關苗栗縣南庄鄉124乙縣道土石崩落情形，經致電南庄鄉公所羅鄉長並表示：124乙縣道屬縣府權責，目前已由縣府開口廠商進行搶通中。\n三、另羅鄉長表示：鄉內苗20、21等鄉管道路亦有零星土石崩落災情，公所接獲村里長通報後，均已納入清除排程，目前刻正由南庒鄉公所開口廠商依道路權重進行搶通中。\n四、本災點（124乙縣道）非土石流、大規模崩塌範圍。\n五、本署及台中分署因應0404豪雨土石流及大規模崩塌災害緊急應變小組已於08時30分3級開設。並依據氣象情資於4日9:30發布土石流黃色警戒計3條，計於1縣(市)2鄉(鎮市區)3村(里)，分布於苗栗縣三灣鄉、南庄鄉。"}]}, {"m": "115年5月", "n": 1, "items": [{"s": "苗栗縣府勘災車摔落4米深野溪 4人傷勢曝光", "a": "苗栗縣政府農業處兩名職員於今日中午11點多會同及顧問公司人員，前往苗栗縣造橋鄉執行「0404 豪雨災後復建工程」的複勘作業時，行車途中發生意外，整輛車摔落4米深野溪，造成車上4人受傷。", "u": "臺中分署", "d": "115/05/12", "st": "存參", "p": "臺中分署於115.5.12回應。", "k": "一、本署臺中分署同仁5月12日會同苗栗縣政府及顧問公司，為115年4月豪雨辦理公共設施災後復建勘災，已完成造橋鄉受損農路災後會勘 。\n二、返程途中，苗栗縣政府前導車輛因不明原因偏離路面，翻覆墜落約4公尺深溪谷。\n三、消防局於13時40分完成救援，車內4人受傷（縣府人員2員、顧問公司2員）均送往苗栗大千醫院，意識清楚且無生命危險；臺中分署勘災同仁均平安。\n四、後續處置：本署持續關心受傷同仁治療情形，並已請各分署所有同仁及團隊注意，務必加強山區勘查作業之安全管理與風險評估。"}]}, {"m": "115年6月", "n": 6, "items": [{"s": "竹北博愛街淹水釀滅頂憾事 民代指排水權責「行政三不管」", "a": "竹北昨不幸受困洪水殞命的黃姓女子座車，在圖中黑圈處、鳳山溪支流旁被「撈起」。搜救人員說，當時現場是一片「池塘」。（圖由竹縣府消防局提供）", "u": "臺北分署", "d": "115/06/29", "st": "存參", "p": "臺北分署於115.6.29回應。", "k": "一、有關媒體報導竹北市博愛街豪雨積淹水事件，提及鳳山溪支流、農田野溪及管理權責等議題，本分署已查證相關位置、山坡地範圍及經濟部公告河川治理界點資料。\n二、經查，本案所在地位於非山坡地範圍；鳳山溪屬中央管河川，媒體所稱鳳山溪支流依經濟部(113.10.30經授水字第11360019731號)公告河川治理界點資料，位於治理界點以下，非屬本署依法辦理之山坡地野溪治理範圍。\n三、本署依《水土保持法》辦理山坡地野溪治理，並以經濟部公告河川治理界點作為河川與野溪治理權責劃分依據；現行法令及本署業務並無「農田野溪」之權責分類，相關治理及管理權責仍應由主管機關依相關法令認定。\n四、應辦事項：本分署將配合本署及相關主管機關提供河川治理界點及相關資料，協助釐清權責疑義。"}, {"s": "南橫荖濃溪清淤 拚8月完成發包", "a": "颱風汛期步步逼近，為了解決高雄桃源區台廿線南橫公路沿線的荖濃溪河床嚴重淤積、危及道路與農地安全的燃眉之急，立委林岱樺召開跨部會協商會議，決定「朝向八月完成發包的目標全力衝刺」。", "u": "臺南分署", "d": "115/06/25", "st": "存參", "p": "臺南分署於115.6.30回應。", "k": "一、有關自由時報報導農村水保署已依規劃在荖濃溪河川界點以上，鎖定總清疏量118萬立方公尺、總經費逾1億元的目標，確保工程如期完成。\n二、經查所提清疏工程為已核定之瓦阿係吊橋上下游清疏、瓦阿係吊橋下游河道清疏、拉庫斯溪復興橋上游清疏二期、拉庫斯溪出流口緊急清疏、清水溪野溪清疏、布唐布那斯溪與荖濃溪匯流口清疏等6件，目前除瓦阿係吊橋上下游清疏(區公所正簽辦上網)及布唐布那斯溪與荖濃溪匯流口清疏(區公所正辦理用地取得中)尚未發包外，其餘4件工程均已在施工中。\n三、有關中央社報導拉庫斯溪與荖濃溪交界處，地方爭取施作600公尺的護岸工程，經查區公所尚未提報計畫，臺南分署將俟區公所提報計畫後辦理現勘作業。\n四、應辦事項：本案清疏工程及區公所將提報之工程，臺南分署將協助桃源區公所辦理。"}, {"s": "3大關鍵法令可救保育生態 農業部挨批裝死不作為", "a": "前年9月，南投縣政府宣佈將在名間鄉新民村興建一座「垃圾處理及再生能源中心」，也就是大型垃圾焚化爐，消息一出，立刻引發居民強烈反彈，因為當地是茶葉產區及水源地，大家都很擔心，焚化爐會汙染空氣及水源，但縣府不願妥協，持續推動開發案，也辦理多場說明會，但仍無法消除居民的疑慮。", "u": "本署", "d": "115/06/15", "st": "發新聞稿-澄清", "p": "本署於115.6.15發澄清新聞稿。", "k": "【澄清稿】針對媒體今(15)日報導「南投縣政府預計於名間鄉興建焚化爐」議題，農業部重申，名間鄉為國內茶葉重要生產區，也是石虎等重要野生動物棲地；目前農業部尚未收到名間鄉焚化爐農業用地變更案件相關資料，如果後續進入農地變更程序，將堅守必要性、合理性及不可替代性三原則嚴格把關，以確保農業生產環境與生態棲地安全。\n有關報導指出農業部可依據相關法規予以否決該案，農業部表示，名間鄉焚化爐設置位置為特定農業區農業用地，係屬優良農地範圍，依據現行開發審議行政程序，該農地若要變更作為焚化爐使用，南投縣政府需取得環評審查同意、農地變更同意，並經內政部區委會開發審議同意，才能進行開發利用。有關該三項審議作業，對於民眾提出影響茶葉生產環境、水源安全、石虎生態棲地等議題，將會納入相關審議評估，農業部支持相關審議皆應嚴審民眾所提出之相關疑慮。\n農業部再次強調，倘後續收到南投縣政府申辦名間鄉焚化爐農業用地變更案件相關資料，鑒於該地區為國內重要之茶葉生產地區，亦為石虎等重要保育類動物棲地，農業部會考量當地民眾及相關團體意見，審慎做出評估及建議，以維護農地資源及珍貴野生動物棲息環境。"}, {"s": "有關「我是南投人」臉書訊息張貼南投縣政府維管之投89線(仁愛鄉力行道路)發生崩塌，道路交通中斷", "a": "南投的雨水是不是不用錢啊？豪雨狂炸連日來，力行產業道路又雙叒叕撐不住了！", "u": "南投分署", "d": "115/06/14", "st": "存參", "p": "南投分署於115.6.14回應。", "k": "【災情時間】115/6/14 14:00\n【災情地點】南投縣仁愛鄉(TWD97:266475.6,2663538.6)\n【災情概述】\n一、受近日降雨影響，仁愛鄉力行產業道路投89線18.2K、36.5K、46K處邊坡發生崩塌，落石掉落阻礙道路，導致交通中斷。\n二、經電話聯繫仁愛鄉公所及發祥村全芊蕙村長，縣府緊急搶修搶險廠商已進行道路搶修通，目前道路暢通。\n三、本災點非土石流潛勢溪流。\n【涉及權責單位】南投縣政府、仁愛鄉公所\n一、投89線為鄉道(2008年12月提升為鄉道)，屬縣府權責。\n二、本道路災害類型均為上下邊坡崩塌，因屬不可分割範圍，因此均為道路主管機關權責，近15年均未投入相關治理經費。\n三、因地質破碎，災害不斷，縣府112年卡努颱風迄今已爭取行政院核定C1類公路系統(公路局審議)災害復建工程共20件，辦理上下邊坡整治及路面改善等工程。"}, {"s": "山坡地違法開挖雨後成水池 苗栗居民憂泥流災情重演", "a": "梅雨鋒面接連報到，對苗栗通霄榮華社區的居民來說，可是提心吊膽，因為今（2026）年4月4日的強降雨，社區後方違法開挖的山坡地，引發泥流沖入民宅；事隔2個月進入梅雨季，住戶發現開挖的坑洞變成大水池，擔心災情重演。目前苗栗縣政府緊急調派怪手挖掘引水道，但居民認為這根本治標不治本，甚至有住戶被嚇到，用鐵板把家裡的後門直接封死，就怕土石再度沖進家園。", "u": "臺中分署", "d": "115/06/12", "st": "存參", "p": "臺中分署於115.6.12回應。", "k": "一、本案經洽苗栗縣政府表示，違法地號位於苗栗縣通霄鎮南華段1429、1444、1445、1446、1447、1448、1449等地號，非屬山坡地範圍。\n二、本案違反土地使用管制，係由該府地政處依都市計畫法裁罰，112.7.31裁罰6萬元、114.10.15裁罰15萬元、115.4.10裁罰45萬元，共計66萬元。\n三、民眾陳情事項，由縣府水利處115.6.9進場代為履行設置洩水道，並於同日移送地檢署偵辦。\n四、應辦事項：本案非屬山坡地範圍，尚無本署需辦理事項。"}, {"s": "南投客家電視台李永盛記者詢問保甲林溪工程整治情形及本次豪雨的因應作為以及土石流監控狀況，南投分署於115年6月10日12時40分在南投分署防災中心錄製影片提供給記者。", "a": "採訪內容：保甲林溪工程整治情形及本次豪雨的因應作為以及土石流監控狀況", "u": "南投分署", "d": "115/06/10", "st": "存參", "p": "南投分署傅桂霖分署長於115.6.10提供影像資料。", "k": "一、保甲林溪工程整治情形:\nDF185保甲林溪是位於南投縣信義鄉明德村及水里鄉上安村交界，因113年凱米颱風強降雨造成當地重大土砂災害，本分署立即於該區進行3件整治工程，並已陸續施作完成，目前河道水流暢通。\n二、針對本次0608豪雨的因應作為:\n目前持續加強該區的防災守視，除了汛期前於3月27日與地方鄉鎮長進行首長會談，水保署長官亦於5月20日現場視察；現場架置土石流CCT影像，可即時觀測現況，隨時監控並掌握現場情況立即應變。"}]}, {"m": "115年7月", "n": 6, "items": [{"s": "露營場合法化卡關 南投縣長許淑華喊話中央鬆綁法規", "a": "全國約有1700多家露營場，苗栗縣和南投縣即占約4成，南投縣長許淑華今天（22日）在兩縣露營場合法化輔導交流活動說，目前各縣市露營場申設通過比例不甚理想，主因在於營位設施用地使用容許比例一直無法突破，需要各地方政府持續向中央發聲，爭取放寬規範，才能讓露營產業永續發展。", "u": "坡地管理組", "d": "115/07/23", "st": "存參", "p": "坡地管理組於115.7.23回應。", "k": "一、交通部111年訂定「露營場管理要點」規範露營場面積不超過1公頃，容許設置露營設施面積不超過全區10%，並以660平方公尺為限。但配合露營業者反應之相關意見，農業部已積極配合交通部陸續修正放寬多項法令規定，包括：(1) 農牧用地露營設施高度由3公尺放寬至4公尺、(2)得增設區內通路面積不超過露營場面積5%、(3)活動式露營帳篷免計入營位設施面積、(4)露營場申請範圍之審查許可與露營場範圍外的其他既有設施，脫鉤處理、(5)新增公告水保計畫「露營場適用」之簡化格式，以兼顧法規與業者營運需求。\n二、對於位於環境敏感地區得否設置露營場，行政院於114年6月4日召開會議討論後，基於安全考量，仍決定19項環境敏感地區 (如特定農業區、特定水土保持區、土石流潛勢溪流及其流域範圍)等環境敏感地區，尚不放寬設置露營場。\n三、有關露營場業者之訴求，本署將持續參加交通部觀光署相關跨部會研商會議，持續積極協助研析精進措施，共同協助輔導露營場業者合法化。"}, {"s": "驚悚空拍畫面曝光「上千噸巨石崩落」大貨車遭擠壓推斷崖", "a": "受巴威颱風來襲連日豪雨影響，苗栗山區驚傳恐怖坍方意外！苗栗縣大湖鄉「苗62線」2.5公里處，昨(13)日深夜10時許發生邊坡坍方事故，大量巨石與土石流傾瀉而下，造成雙向交通中斷，驚險的事，有名46歲羅男當時駕駛大貨車行經該路段，突然坍方的巨大落擊中，導致大貨車嚴重受損，人車險遭活埋，所幸駕駛命大，意識清醒、生命徵象穩定，傷勢無大礙未送醫。", "u": "臺中分署、減災監測組", "d": "115/07/14", "st": "存參", "p": "臺中分署於115.7.14回應。", "k": "一、本案位於苗栗大湖鄉富興村苗62線道路2.5K處，於13日晚間再度發生道路上邊坡崩塌，大量落石將一輛行經的大貨車推擠至懸崖邊，造成駕駛擦傷，道路中斷。經查詢苗栗大湖鄉公所，目前已由苗栗縣政府於今（14）日派遣開口契約廠商進行搶通作業。\n二、經查本次災情崩塌地點為山坡地保育區林業用地，苗栗縣政府曾於110年辦理「大湖鄉苗62線2K+100段道路復建工程(4886.3萬元)」，本次災情後續由苗栗縣政府提報災害復建工程(C1：屬公路系統工程)。\n三、本災點非為土石流或大規模崩塌範圍。"}, {"s": "巴威釀新竹部落聯外道路中斷尖石鄉約百處路面受損", "a": "巴威颱風侵襲，新竹縣尖石鄉出現災情，司馬庫斯和石磊部落聯外道路尤其嚴重。同樣受災嚴重的還有桃園市復興區，巴威颱風在石門水庫集水區帶來豐沛雨量，總入流量約2.2億噸，相當於一座石門水庫的蓄水量，但瞬間大雨也讓水庫工作船受災嚴重，沉了十幾艘，現在還無法打撈上岸。", "u": "臺北分署、減災監測組", "d": "115/07/13", "st": "存參", "p": "臺北分署於115.7.13回應。", "k": "一、本次巴威颱風造成新竹縣尖石鄉的災情嚴重，道路受損部份已經由新竹縣尖石鄉公所進行搶通修作業，經115年7月14日聯繫尖石鄉公所劉德華課員表示，大部分已經搶通。\n二、桃園市復興區山區道路災害，經聯繫公所皆已完成大部分搶通修作業。\n三、前開災害擬由尖石鄉公所循序報請中央災害復建計畫，復興區公所則報請桃園市政府災害準備金進行災後復建，臺北分署亦將協助勘災，原則上部落聯外道路尖石鄉及復興區權屬原民會，如有需求，後續再依公所提報內容進行協助。\n四、應辦事項：無"}, {"s": "新竹秀巒「大規模山崩」 500人受困 憂斷電斷糧", "a": "巴威颱風侵襲，新竹秀巒村發生大規模山崩！大量土石瞬間往下沖，導致竹60線中斷，司馬庫斯、泰崗部落、還有錦路部落等等，瞬間成為孤島，至少五百人受困。秀巒居民告訴我們，親戚現在都還在山上，斷電之後，網路越來越差，就怕會失聯，她心急如焚。", "u": "臺北分署、減災監測組", "d": "115/07/11", "st": "存參", "p": "臺北分署於115.7.11回應。", "k": "一、媒體報導新竹尖石鄉秀巒村發生大規模山崩，土石阻斷聯外道路竹60線，導致上方的司馬庫斯等部落淪為孤島，至少500人受困。\n二、新聞中所稱之秀巒大崩塌既有坡趾堆積土砂發生局部崩滑，業已透過CCD攝影機畫面確認土砂遭白石溪洪水沖走，並無阻斷河道及道路。\n三、本分署另聯繫新竹縣政府災害應變中心查證確認係新竹縣尖石鄉竹60線道路上邊坡多處（三、5K、26K及30K）崩塌導致通往後山唯一道路阻斷，且已於今日下午恢復單線通車，並無部落淪為孤島及居民受困之情事。\n四、該新聞台多起事件一起報導，卻下標題張冠李戴將停電等事由歸因秀巒大規模山崩，除言過其實，亦實屬誤導觀眾。\n五、應辦事項：本案尚無本署權責。"}, {"s": "強颱巴威逼近！雙溪山坡地赤皮崙居民憂「土石流」毀家園", "a": "強颱巴威逼近！住在新北市雙溪赤皮崙的居民，擔心歷經颱風與豪雨的山坡地，已經接連坍塌，就怕這次的暴風圈靠近，災情重演，嚴重土石流，沖毀家園。區公所回應，搶災工班已經在現場待命，山區住戶也都納入列管，若宣佈土石流紅色警戒就會強制撤離。", "u": "臺北分署", "d": "115/07/09", "st": "存參", "p": "臺北分署於115.7.9回應。", "k": "一、有關媒體報導114年1020豪雨造成新北市雙溪區北38線4k~7k邊坡崩塌，居民憂心巴威颱風侵臺期間災情重演議題，本分署已查證相關位置、鄰近土石流潛勢溪流及大規模崩塌潛勢區等資料。\n二、經查，本案災點於113年山陀兒颱風期間已發生崩塌災害，1020豪雨期間，新北市政府工務局養護工程處執行「114年度新北市轄區內災害緊急搶修及復健工程（第1區）雙溪區北38線5k+100上邊坡復健工程」已接近完工，惟受1020豪雨影響，既有災區擴大，並影響北38線沿線居民及電塔等設施。\n三、新北市府工務局114年11月24日邀集各相關單位研商權責，決議請新北市府依公共工程委員會公共設施災後復建工程經費審議及執行作業要點併前期調查監測成果提報後續災害復建經費。\n四、經洽詢新北市政府工務局養護工程處，未獲得工程會同意災害復建工程經費追加，目前已完成緊急搶通作業，並於部分坡面施作加固工程（預計115年7月20日完工），後續仍有坡面排水工程需執行；目前因應巴威颱風可能造成之影響，已安排兩組工班及機具於現場待命。\n五、本案災點經查無鄰近土石流潛勢溪流及327處大規模崩塌潛勢區。災害型態為縣市管道路邊坡崩塌，權責單位為道路主管機關（新北市政府工務局）\n六、應辦事項：本案尚無本署權責"}, {"s": "中央社記者採訪案", "a": "中央社記者於115.7.9 下午3點30分以電話採訪減災監測組陳振宇組長，採訪內容：詢問日前民視新聞報導之 AI 土石流辨識，是否已應用於土石流警戒發布，以及其實際用途。", "u": "減災監測組", "d": "115/07/09", "st": "存參", "p": "減災監測組陳振宇組長於115.7.9回應", "k": "一、說明本署目前發展之 AI 影像辨識，主要係用於輔助防災值勤與監測作業，協助本署防災人員降低 24 小時持續觀看 CCD 影像之負擔。當 CCD 影像出現明顯變化時，AI 模組可協助初步察覺，並通報工程師進一步確認。\n二、另說明目前土石流紅、黃警戒發布，仍主要係依據降雨量及「以降雨為基礎之警戒基準值」辦理。CCD 影像目前主要作為災害現象觀察、土石流實際發生時間確認及事件後檢討之參考，並可作為日後雨量警戒值調整之重要參據，尚非直接作為土石流紅、黃警戒發布之主要依據。"}]}, {"m": "115年8月", "n": 4, "items": [{"s": "中央廣播電台陳記者採訪", "a": "中央廣播電台陳記者於115.8.27上午10點30分以電話採訪減災監測組陳振宇組長，採訪內容：8/26尼泊爾冰川崩塌導致山洪事件對台灣土石流防災的啟示", "u": "減災監測組", "d": "115/08/27", "st": "存參", "p": "減災監測組陳振宇組長於115.8.27回應。", "k": "一、山區災害具有突發性及上下游連動特性，上游發生崩塌或河道阻塞，可能在短時間內影響下游。民眾不能只看所在地有沒有下雨，也不要等看到土石流或洪流才開始撤離。土石流黃色警戒代表應提前準備；風險升高時，應依地方政府通知及早疏散撤離。\n二、如果發現溪水突然混濁、暴增、暴減，或聽到山鳴、巨石碰撞聲及感受到地表震動，都可能是上游發生異常的警訊。發現異常時，不要靠近查看或停留拍攝，應立即遠離溪床、低窪地區，往兩側較高處避難。\n三、防災最重要的是提早行動，不要把最後的避難時間用來等待災害是否真的發生。\n四、應辦事項：無。"}, {"s": "TVBS王皓宇記者採訪", "a": "TVBS王皓宇記者於115.8.25下午2時30分視訊採訪減災監測組陳振宇組長，採訪內容：1.土石流警戒發布機制2.有效累積雨量概念3.短延時強降雨動態調整機制4.與地方政府預警資訊傳遞方式及疏散撤離作業", "u": "減災監測組", "d": "115/08/25", "st": "存參", "p": "減災監測組陳振宇組長於115.8.25回應。", "k": "一、簡要說明土石流發生的條件及紅黃警戒發布的時機，並針對短延時強降雨設有動態調整機制。同時透過地方政府通報、系統介接及細胞廣播等方式傳遞預警資訊，協助地方政府及民眾及早採取防災應變與疏散避難措施，降低災害風險。\n二、本次專訪預定於8月27日晚間TVBS「十點不一樣」節目播出，將持續關注報導內容。"}, {"s": "中時記者蔡佩珈、楊雅婷採訪", "a": "採訪內容：為何今天下午位於新北市的民眾，會收到高雄市甲仙區和安里的土石流黃色警戒細胞廣播？", "u": "減災監測組", "d": "115/08/23", "st": "存參", "p": "減災監測組陳振宇組長於115.8.23回應。", "k": "針對今日下午 3 點半「高雄甲仙和安里」細胞廣播外溢至外縣市一案，經本署檢視，本次豪雨期間發布之 85 則細胞廣播中，僅有此則因「單一電信業者」發生外溢狀況，其餘 84 則皆精準發送。已請該電信業者查明並修正，後續將加強監控檢視，確保告警訊息精準傳達。"}, {"s": "南庄鄉301農路搶通後再度崩塌 縣府邀中央3機關現勘研議", "a": "苗栗縣府農業處10日邀集農業部水保署、林保署、原民會及南庄鄉公所等共同現勘，針對道路復建、坡面穩定、水土保持、農民通行及農產品運輸等問題交換意見，研議後續處理方向。（苗栗縣政府提供╱謝明俊苗栗傳真）", "u": "臺中分署", "d": "115/08/10", "st": "存參", "p": "臺中分署：臺中分署於115.8.10現勘後回應。", "k": "一、有關301農路搶通部分，請南庄鄉公所辦理，如再有崩塌中斷情形，仍請公所持續搶通，以利民眾通行，另如有颱風豪雨情況，請管制出入。\n二、縣府將評估搶通後是否搭鋼便橋，避免因崩塌造成農路中斷，後續將辦理災害復建整體治理評估方案。\n三、苗栗縣政府已向行政院工程會提報4,300萬元天然災害復建工程經費。"}]}], "GROUPS": [{"g": "坡地防災整備", "items": [{"lab": "土石流潛勢溪流", "unit": "條", "vals": {"v1": "1,753", "v2": "1,753", "v3": "1,753", "v4": "1,753", "v5": "1,753", "v6": "1,753", "v7": "1,753", "v8": "1,753", "v9": "1,753", "v10": "1,753"}, "mini": "17縣市・159鄉鎮・692村里（其中114年1,745條，115年新增8條）", "src": "prep"}, {"lab": "中高風險溪流", "unit": "條", "vals": {"v3": "903", "v4": "903", "v5": "903", "v6": "903", "v7": "903", "v8": "903", "v9": "903", "v10": "903"}, "mini": "占51.5%（高418・中485・ tle": "公地放領", "text": {"v10": "行政院 114.11.27 院會決議重啟公地放領，由內政部統籌；本署 115.2.26 修正發布「公有土地放領影響水源涵養國土保安及自然保育認定作業要點」。"}, "src": {"t": "W", "sec": "公地放領", "page": 12}}, {"cat": "農村再生與建設", "kind": "制度與政策", "title": "農村發展重點區", "text": {"v10": "自 115 年起作為資源優先投入核心；115 年度選定 16 處、108 個村里，由各分署整合推動軟硬體建設，已核定多項工程與輔導計畫。"}, "src": {"t": "W", "sec": "農村發展重點區", "page": 14}}, {"cat": "農村再生與建設", "kind": "工作進展", "title": "區域亮點工程", "text": {"v10": "115 年度核定 136 件、總經費 8.9 億元，服務 126 個社區，改善社區道路及通行環境約 28 公里。"}, "src": {"t": "W", "sec": "農村建設工程", "page": 15}}, {"cat": "農村再生與建設", "kind": "後續工作", "title": "農村再生工程設施體檢", "text": {"v10": "設施依狀況分 A～E 級管理；114 年度完成 225 件，115 年度預計擴大辦理 460 件。"}, "src": {"t": "W", "sec": "農村再生工程設施體檢與維護", "page": 14}}, {"cat": "農村再生與建設", "kind": "制度與政策", "title": "金牌農村競賽與農村領航獎整併", "text": {"v10": "第四屆 115.7.22 起跑記者會、8 月辦理 6 場縣市說明會；依農業部 115.4.14 會議決議，兩項選拔自 119 年起整併，每 3 年擴大頒獎。"}, "src": {"t": "W", "sec": "金牌農村競賽(106年開始辦理)", "page": 15}}, {"cat": "農村再生與建設", "kind": "工作進展", "title": "農村文化保存（農村好藝計畫）", "text": {"v10": "114 年起由調查紀錄轉型為輔導及補助；115 年第二屆收件 67 件，實際入選 27 件，核定補助 771 萬元。"}, "src": {"t": "W", "sec": "農村文化保存", "page": 16}}, {"cat": "休閒農業區", "kind": "制度與政策", "title": "休閒農場申設規定", "text": {"v10": "申設面積不得小於 1 公頃（休閒農業區內或離島 0.5 公頃），農業用地應占全場面積 90% 以上。"}, "src": {"t": "W", "sec": "休閒產業", "page": 16}}, {"cat": "農地管理", "kind": "制度與政策", "title": "容許辦法修正草案", "text": {"v10": "依行政院會議決議檢討修正容許辦法第 28 條、第 29 條之 1、第 33 條及第 21 條附表 4；115.7.8 報送預告前通報單及修正草案予行政院核復。"}, "src": {"t": "W", "sec": "農地設置太陽光電設施之原則", "page": 18}}, {"cat": "農地管理", "kind": "工作進展", "title": "農地接電案件複查", "text": {"v10": "114 年擴大至全國 22 縣市，篩選 1,514 筆高用電案件複查；「疑似違規」占 52.6%、「疑似轉供」占 8.3%。"}, "src": {"t": "W", "sec": "源頭管制農業用地接電案件複查作業", "page": 20}}], "wsec": {"修訂土石流及大規模崩塌警戒基準值": {"page": 2, "text": "◎修訂土石流及大規模崩塌警戒基準值\n\n1. 94年起每年防汛期前完成檢討並公開。\n\n2. 目前土石流警戒基準值主要分布於250~650mm。\n\n3. 每年汛期前召開審查會調整並依法公開。\n\n4. 115年度土石流警戒基準值更新：於114年12月16日邀請相關機關及專家學者召開審查會確認115年度土石流警戒基準值，並於115年1月14日以農授農保字第1152671431號函公開115年土石流警戒基準值明細表，計調整4縣(市)、8鄉(鎮市區)之土石流警戒基準值。\n\n5. 大規模崩塌潛勢區之警戒發布，考量疏散實務分2類操作，自110年起實施，115年累計公開94處（本署82處、林業保育署12處），第1類型34處，第2類型60處，各類型之詳細資料如后：\n\n(1) 第1類型：保全住戶與土石流重疊，警戒值：250~650mm。\n\n 1.保全住戶與土石流保全住戶重疊，以土石流警戒值發布。\n\n 2.居民已有土石流自主防災經驗，較易推動。\n\n(2) 第2類型：保全住戶與土石流保全住戶無重疊，警戒值：600~1500mm。\n\n1. 保全住戶與土石流保全住戶無重疊，依大規模崩塌警戒值發布警戒。\n\n2. 對於新增區域居民較無自主防災經驗，以說明會形式加強防災宣導、演練及溝通。"}, "二次災害高風險區之防汛期坡地防災整備強化作為": {"page": 3, "text": "◎二次災害高風險區之防汛期坡地防災整備強化作為\n\n一、新生崩塌分類與處理原則及辦理情形\n\n(1) 新生崩塌分類與處理原則\n\n 1.Type\n A：新生崩塌位於既有土石流潛勢溪流集水區，調升土石流風險等級，調整警戒值及影響範圍。\n\n 2.Type B：新生崩塌符合新增土石流潛勢溪流條件，納入土石流警戒機制。\n\n 3.Type\n C：新生崩塌鄰近保全住戶，但不符合新增土石流潛勢溪流條件者，劃為災後土砂敏感區，建立地方自主災能力。\n\n(2) 辦理情形：截至114年10月07日止，113年0403地震、凱米、山陀兒、康芮、114年丹娜絲颱風及0728豪雨等災害事件，累計二次災害高風險區計42處，分別為花蓮縣16處、高雄市10處、屏東縣3處、臺東縣5處、宜蘭縣2處、南投縣2處、嘉義縣1處、桃園市1處、新竹縣1處及新北市1處。\n\n二、強化防災整備與應變協作\n\n(1) 農村水保署：清查災後新增土石流潛勢溪流及土砂敏感區、劃設影響範圍並提供地方政府建位保全清冊與避難計畫，研訂注意值、發布細胞廣播警戒訊息，即時通報民眾及通報地方政府(雨量>注意值)。\n\n(2) 地方政府：建立保全清冊及疏散避難計畫、風險告知及強化民眾自主防災能力、建立社區防災應變與通報機制、適時執行預防性疏散。\n\n(3) 強化應變作業：針對Type A, B,\n C內降雨易致災區，統稱為「二次災害高風險區」，納入下次應變守視重點，如雨量超過注意值，將透過細胞廣播先期告警，並於土石流黃色警戒發布後，優先進行預防性疏散。"}, "不安定土砂災害風險監控與管理": {"page": 7, "text": "◎不安定土砂災害風險監控與管理\n\n一、為降低極端氣候引發不安定土砂災害風險(如110年8月盧碧颱風，沖毀台20線明霸克露橋，導致部分聚落對外道路中斷形成孤島)，行政院前於111年11月18日核定「氣候變遷下大規模崩塌及不安定土砂防減災第二期(110-115年)計畫」修正，並自113年起增加辦理五大流域不安定土砂防減災工作。\n\n二、為建立不安定土砂風險監控體系，本署多次召開專家諮詢會議確立推動策略及重點工作，說明如下：\n\n(1) 新生崩塌判釋：颱風豪雨或重大地震災害後，啟動多元衛星影像判釋山坡地新生崩塌。\n\n(2) 殘坡判釋與更新：運用最新數值地形及衛星影像，綜合判釋易發生再次崩塌或滑動的不安定邊坡(即殘坡)，115年公開962處殘坡，主要分布在高屏溪、卑南溪與濁水溪流域。\n\n(3) 鐵公路橋梁受不安定土砂衝擊評估：全臺省公路及鐵路橋梁受不安定土砂影響者計323處。其中屬極高潛勢者18處，集中分布於0403花蓮地震災區及高屏溪流域。\n\n(4) 流域土砂長期動態監控：至115年已完成大甲溪、濁水溪、曾文溪、高屏溪與淡水河土砂量體變異分析，掌握長期土砂動態趨勢，提供流域土砂管理與國土防災重要參據。\n\n(5) 土砂衝擊危害分析：建立數值模擬分析技術，評估各種降雨情境下，不安定土砂對重要設施及保全對象衝擊危害程度。"}, "土石流及大規模崩塌防災整備": {"page": 1, "text": "◎土石流及大規模崩塌防災整備\n\n1. 115年全臺土石流潛勢溪流共計1,753條，分布於17縣(市)、159鄉(鎮、市、區)、692村(里)(其中114年1,745條，115年新增8條);大規模崩塌潛勢區共計94處（本署82處、林業保育署12處），分布於12縣(市)、42鄉(鎮、市、區)、69村(里)，其中新增計15處。\n\n(1) 土石流潛勢溪流(1753條)比例結構分析\n\n 1. 高風險：418條（約23.8%）\n\n 2. 中風險：485條（約27.7%）\n\n 3. 低風險：573條（約32.7%）\n\n 4. 持續觀察：277條（約15.8%）\n\n(2) 其中，中高風險合計903條，占\n 51.5%，代表超過半數溪流具一定致災潛勢，整體風險壓力仍偏高。\n\n2. 115年針對全臺17縣市159鄉鎮702村里(含土石流及大規模崩塌潛勢區所在村里)於防汛期前完成保全住戶清冊校核及疏散避難計畫檢討更新，保全清冊總計52,783人。\n\n3. 114年度培訓土石流防災專員共378人，115年已完成培訓376人，累積人數為3,819人，投入社區自主防災工作。\n\n4. 114年補助地方政府辦理自主防災實作演練59場、兵棋推演173場、自主防災裝備及設備強化70處；115年預計辦理自主實作演練60場、兵棋推演176場、自主防災裝備及設備強化61處，截至115年10月底辦理自主實作演練60場(較9月增加3場)、兵棋推演176場、自主防災裝備及設備強化61處。\n\n5. 115年已於汛期前辦理防災業務人員教育訓練及地方首長座談會27場。\n\n6. 自93年起至106年輔導550村里土石流自主防災社區，並於107年起推動自主防災社區2.0計畫。115年8月底已完成94處大規模崩塌潛勢區村里自主防災社區輔導，全臺累積已推動628村里自主防災社區。"}, "氣候變遷下大規模崩塌防減災計畫": {"page": 8, "text": "◎氣候變遷下大規模崩塌防減災計畫\n\n第一期：\n\n一、106年~109年(本署30億元，林業署4億元)\n\n二、4年執行績效：大規模崩塌影響範圍劃定34處、疏散避難規劃33處、聚落防護能力改善2,250戶。\n\n第二期：\n\n一、110年~115年(本署59.5億元，林業署6億元)\n\n二、執行範圍：經濟部地礦中心及林業署已判釋約9,948個大規模崩塌潛勢區，其中327處影響範圍鄰近聚落，潛勢區及其影響範圍、坡頂上方與鄰近上下游集水區皆為計畫主要執行範圍。\n\n三、執行績效：具較高風險之大規模崩塌潛勢區133處，辦理98處防災應變管理值訂定及相關作為(防災警戒整備率達74%)。其中90處需進行減災處理工程辦理54處減災處理與管理作為。(防護能力提升率達60%)\n\n第三期：\n\n116年~121年(本署66億元，林業署6億元)：辦理121處防災監測機制建立及\n\n相關作為(防災警戒整備率達76%)。其中147處需進行減災處理工程辦理108\n\n處減災處理與管理作為。(防護能力提升率達73%)"}, "G1H3天然災害公共設施復建工程相關法規及審議": {"page": 7, "text": "◎G1H3天然災害公共設施復建工程相關法規及審議\n\n一、工程會於90.10.19訂定「公共設施災後復建工程經費審議作業要點」配合「中央對各級地方政府重大天然災害救災經費處理辦法」，訂定災後公共設施復建工程經費的審議與執行規範。115.05.07為檢討審議範圍、作業流程及權責劃分，再次修正本作業要點。\n\n二、99年以前災後復建工程共計3,985件工程，核定經費56億6,002萬1,000元；100至113年期間災後復建工程共計1萬6,399件，核定經費369億5,278萬2,000元；114年天然災害包括鳳凰颱風、1227地震、楊柳颱風、樺加沙颱風災後復建工程共計152件工程，核定經費5億7,426萬9,000元(特別條例另計)。\n\n三、依據丹娜絲颱風及七二八豪雨災後復原重建特別條例(114.8.19總統公布)，災區範圍由行政院114.9.30公告為苗栗縣、臺中市、南投縣、彰化縣、雲林縣、嘉義縣、嘉義市、臺南市、高雄市、屏東縣、花蓮縣及臺東縣。\n\n四、本署依據行政院公共工程委員會114.08.25工程技字第1140200825號函、114.08.29工程技字第1140200842號函訂「丹娜絲颱風及七二八豪雨災後復原重建特別條例公共設施災後復建工程經費審議及執行作業原則」組成G1水土保持類及H3其他農路類專案審議小組，於114.10.16-17、114.12.26\n及115.03.25辦理6場審議會議，依審議結果共核定1,891件工程，核定經費65億4,676萬元。"}, "野溪清疏": {"page": 9, "text": "◎野溪清疏\n\n98年度配合特別預算辦理野溪清疏工作，並自100年度起編列預算，持續疏通野溪瓶頸段及河道，減少土砂下移。截至115年10月底共計核辦1,612件，土砂清疏量7,696.25\n萬方(較9 月增加18.43\n萬方)，平均每年清疏487.48萬方。(115年已核辦1,612件中仍有持續進行清疏工程者，因此核辦件數不變，但土砂清疏量持續增加，另平均每年清疏量減少之主因為近年清疏量逐年降低造成)。"}, "重劃區外緊急農路設施改善計畫": {"page": 8, "text": "◎重劃區外緊急農路設施改善計畫\n\n一、農業部98年至109年間陸續經費153.91億元，已完成農路設施長度約3,844公里。另研提「山坡地農路改善計畫110至113年度」(以下簡稱山坡地農路計畫)辦理。平地農路改善由農水署辦理，重劃區外平地農路改善範疇，由本署協助辦理。\n\n二、「重劃區外緊急農路設施改善計畫114至117年度(第四期)」\n\n(1) 以歷年經輔建改善完成之農路或災害受創，已有安全顧慮及配合其他公共設施之既有農路(農地重劃區外)，繼續加強養護工作。\n\n(2) 不新闢及拓寬農路，以設置必要之避車道為主。\n\n(3) 已有主管機關者：包含編號道路、都市計畫道路、村里聯絡道路、原住民族部落聯絡道路、觀光地區道路、農地重劃區內等，以及為個人需要、園內道路及私人農場內等，不宜辦理。\n\n(4) 以農業生產資材與產物運輸需要之農路為改善對象，並須符合規定者。計畫辦理優先順序1.住家或公共設施對外交通需要者。2.農產運輸需要而路況欠佳，運搬不便者。3.配合產業及聚落發展、有關措施或計畫需要辦理者。4.歷年分年分期改善之未竟工程，確有需要者。\n\n(5) 115年度預定辦理農路水土保持設施改善、路面、路基、排水設施改善等長度約456公里，截至10月底已完成農路設施345公里(較9月增加35公里)。"}, "水保法及山保條例修法": {"page": 13, "text": "◎水保法及山保條例修法\n\n立法院經濟委員會115年5月7日審查委員及黨團提案水保法及山保條例修正草案，並於同年7月29日逐條審查完竣，同年8月21日院會因民進黨團提出異議，院長宣告交由黨團協商，115.8.21二讀，院長宣告交由黨團協商，115.8.27及10.30協商完畢完成三讀，其修正重點如下：\n\n一、調高罰鍰及罰金上限，有助於遏止重大違規案件。\n\n二、低強度或小規模之違規行為，不宜微罪重罰或過度量刑，故建議維持現行規定，罰鍰下限6萬元、罰金不定下限及刑責下限6個月以上之規定。\n\n三、參諸高行政法院108年4月份第2次庭長法官聯席會議決議，處分機關必須於處分書送達後始得再為處罰，故建議維持按次處罰。\n\n四、有關未經同意擅自開發、經營、使用行為之裁罰及違規後續處理部分，以現行第23條擅自開發之處分為基礎進行修正，將令其停工，沒入其設施及所使用之機具，強制拆除及清除其工作物等，一併納入，以強化裁處手段，併再明確規範改正對象及義務，以利實務執行。"}, "白河水庫集水區開挖整地破壞水土保持案": {"page": 13, "text": "◎白河水庫集水區開挖整地破壞水土保持案\n\n一、山坡地從事開發行為，應依水保法第12條規定擬具水保書件送審後實施；未依核定計畫實施或擅自開發者，應依同法第33條規定裁罰，其計畫審核、違規查報、取締及制止均屬地方政府權責。\n\n二、洽臺南市政府表示，白河區關子嶺段89-45地號等17筆土地，涉違反水保法已裁罰3次，共計33萬元並限期改正，竊占移請地檢署偵辦中；另涉建築法及區域計畫法等，亦移請相關單位裁處；部分土地經會同水保服務團現勘係除草行為未涉開挖整地，已限期義務人儘速恢復植生。\n\n三、本署115年11月2日再函請市府審慎檢視現場情況，如有違法情事應立即查處，並將該區位列為衛星影像變異點重點監測熱區，後續變異點通報亦請市府於3日內完成查證，並持續督導該府按月巡查及依法辦理，以遏止不當開發行為。"}, "山坡地超限利用及13座重大水庫及敏感區位涉超限利用查處進度": {"page": 11, "text": "◎山坡地超限利用及13座重大水庫及敏感區位涉超限利用查處進度\n\n一、第一階段：81-114年查核34,619公頃，截至目前520公頃未改善。\n\n二、第二階段期程：112-114年(查復)、115-120年(改正)。\n\n三、第二階段辦理原則：列管3,745.49公頃，國產署、林業署及原民會經管之土地涉超限利用，應善盡管理之責，依面積比例分3年查復（112年30%、113年40%、114年30%），其餘公私有地等涉超限利用土地由各直轄市、縣(市)政府查復；並由本署按季追蹤執行進度及不定期召開檢討會議，自115年起，逐年改正20%，目標於120年前全部完成改正。\n\n四、第二階段辦理情形：截至115年10月31日止，已查復面積為3,189公頃(較9月增加24公頃)，尚未查復面積為556公頃(較9月減少24公頃)。\n\n五、兩階段查處扣除重複未改善面積計1,134公頃"}, "公地放領": {"page": 12, "text": "◎公地放領\n\n一、山坡地公地放領屬內政部權責：依據山坡地保育利用條例第20條第3項規定，公有山坡地放租、放領辦法，由內政部會同有關機關擬訂，報請行政院核定之。\n\n二、山坡地公地放領對象：依內政部訂定「公有山坡地放領辦法」第3條規定，放領之公有山坡地，指山坡地範圍內供農業使用，經依法完成總登記，並依山坡地可利用限度查定為「宜農、牧地」或已編定為「農牧用地」，且在65.9.24以前經依法放租之公有土地。\n\n三、「公有土地放領影響水源涵養國土保安及自然保育認定作業要點」\n\n(1) 公有山坡地放領辦法(內政部)、國有耕地放領實施辦法(內政部)及國有邊際養殖用地放領實施辦法(財政部)等辦法第2條第1項第1款皆規定，關於水源涵養、國土保安、水土保持及自然保育之認定，中央為農業部；同條第2項規定，為辦理前項各款業務，中央主辦機關得訂定相關作業要點。\n\n(2) 本要點於115.2.26以農農保字第1152674460號令修正發布。\n\n四、政策推動情形：\n\n(1) 總統114年5月16日裁示，希望符合放領條件者全部返還人民，以符合歷史轉型正義及人民期待；爰行政院對於民眾數十年來長期承租公有土地之情形，基於歷史轉型正義及兼顧國土保育原則，全面檢討其符合放領條件者開放民眾申請取得，並請內政部統籌。\n\n(2) 行政院於114年9月17日召開「各類公地放領政策研商會議」，請內政部統籌並提行政院政務會議向院長報告後，依指示推動辦理。\n\n(3) 行政院114年11月27日第3980次院會決議略以，本次重啟公地放領的範圍定為「國有平地耕地及邊際養殖用地」。\n\n五、本署因應作業：\n\n(1) 114年12月15本部五長會議指示事項：請本署就山坡地公有地進行盤點與規劃，扣除敏感區域後，精算可辦理公地放領或其他處置之實際面積；另請林業保育署就轄管土地(如國有林地等)同樣辦理相關盤點作業。\n\n1. 本署114年12月17日農保管字第1142673184號函請內政部及財政部國有財產署索取山坡地公有地放領資料。\n\n2. 內政部114年12月22日台內地字第1140154365號函略以，公地放領範圍定為「國有平地耕地及邊際養殖用地」，山坡地放領仍維持停辦。\n\n3. 財政部國有財產署114年12月18日台財產署管字第11400419010號函略以，本次重啟公地放領的範圍定為「國有平地耕地及邊際養殖用地」，山坡地非本次行政院核定重啟公地放領範疇，本署目前無相關土地清冊資料。\n\n(2) 配合內政部及財政部，依據「公有土地放領影響水源涵養國土保安及自然保育認定作業要點」，協助確認有無該要點第2點附表序號4(特定水土保持區)之情形，以確保水源涵養、國土保安及自然保育無虞之前提下，依照行政院指示辦理。"}, "農村發展重點區": {"page": 14, "text": "◎農村發展重點區\n\n一、農村再生政策推動逾15年，累計輔導超過1,000個農再社區。\n\n二、自115年起聚焦「農村發展重點區」，作為資源優先投入核心，強化跨部門及多元資源整合。\n\n三、115年度選定16處重點區、108個村里，由各分署整合推動軟硬體建設：已核定多項工程與輔導計畫，兼顧基礎建設與社區培力，逐步形塑具永續發展潛力之農村體系。"}, "農村建設工程": {"page": 15, "text": "◎農村建設工程\n\n一、115年度核定區域亮點工程計136件，總經費8.9億元。\n\n二、計服務126個社區，改善社區道路及通行環境約28公里，有效提升農村生活機能及整體環境品質。"}, "農村再生工程設施體檢與維護": {"page": 14, "text": "◎農村再生工程設施體檢與維護\n\n一、為降低設施使用風險及避免衍生國賠案件，持續推動工程設施體檢與分級管理制度。\n\n二、依設施狀況分為A至E級，作為後續維護、改善及管理依據。\n\n三、辦理情形：\n\n(1) 114年度完成225件體檢作業。\n\n(2) 115年度預計擴大辦理460件，全面強化設施安全與維護機制。"}, "金牌農村競賽(106年開始辦理)": {"page": 15, "text": "◎金牌農村競賽(106年開始辦理)\n\n一、第一屆：選出22個農村社區（3金4銀8銅7優等）。\n\n二、第二屆：選出23個農村社區（5金5銀9銅4優等）。\n\n三、第三屆：選出22個農村社區（5金6銀7銅4優等）。\n\n四、第四屆：115.7.22辦理第四屆金牌農村起跑記者會，並已於8月份辦理6場次縣市政府說明會。\n\n五、依據農業部115.04.14「本部暨所屬機關舉辦農業頒獎活動檢討會議」決議，「金牌農村競賽」及「農村領航獎」自119年起整併(農村領航獎117年停辦1次)，每3年擴大頒獎，因受獎對象分別為社區及個人，可採「分開選拔、合併頒獎」方式。"}, "農村文化保存": {"page": 16, "text": "◎農村文化保存\n\n1. 114年起，由調查紀錄轉型為輔導及補助制度，並依性質區分為「技藝保存」、「傳承推廣」及「技藝活用」三大類別，藉此延續農村技藝之在地知識，並持續開創可持續經營的文化內容和價值。114年補助29件（技藝保存類14件、傳承推廣類8件及技藝活用類7件）。\n\n2. 115年第二屆農村好藝計畫徵件已於3月27日截止，共計收到67件申請，其中包含技藝保存類19件、傳承推廣類29件及技藝活用類19件。經召開複審會議後計入選30件(技藝保存類10件、傳承推廣類7件、技藝活用類13件)，其中技藝保存類、傳承推廣類及技藝活用類各1件放棄，實際入選27件，核定補助金額計771萬元。\n\n3."}, "休閒產業": {"page": 16, "text": "◎休閒產業\n\n一、全國115個休區、590家休場（423家營業）(較9月增加1家)產值110億元，年遊客數2,984萬人次（國外約55.3萬人次）。休閒農場申設面積不得小於1公頃，農業用地應占全場面積90％以上；惟坐落休閒農業區內或離島者，申設面積不得小於0.5公頃。全場農業用地至少60%以上須供農業、森林、水產、畜牧等事業使用。\n\n二、輔導農遊超市輔導推動情形：截至115年10月底，推出共計351家(較9月增加3家)業者900條行程於農遊超市銷售。(較8月份896條，增加4條，係因每個季節會有不同行程，所以會依據時節跟場域能提供的服務會有滾動的調整)。"}, "農地設置太陽光電設施之原則": {"page": 18, "text": "◎農地設置太陽光電設施之原則\n\n一、以「農業為本、綠能加值」為主軸，優先推動農業設施屋頂型太陽光電(畜電共生等)，再逐步發展地面型漁電共生，使農業與綠能共存共榮。申請農業用地作農業設施容許使用審查辦法」（以下簡稱容許辦法），已明定綠能設施得在不影響農業經營之前提，於農業設施屋頂附屬設置或於地面設置，說明如下：\n\n(1) 營農屋頂型（第28條）：各類農業設施屋頂附屬設置之綠能設施，如畜禽舍、溫室及室內養殖設施等，規範申請者須依農業經營計畫內容確實作農業使用，且綠能設施不得影響農業設施內之動植物生長。\n\n(2) 營農地面型（第29條）(漁電共生類)：應位於農業經營結合綠能之專案計畫範圍內，或可優先推動漁業經營結合綠能之區位，在該範圍或區位內之農漁民得申請設置與農業經營使用相結合之地面型綠能設施。\n\n(3) 非營農地面型(第30條)：符合特定區位及條件者，如不利農業經營農地、污染控制場址等，得設置免與農業經營相結合之遮蔽率70％綠能設施，須符合點狀施作之原則。另農業部已公告2,162公頃不利農業經營得設綠能設施之範圍。\n\n二、依據行政院會議決議檢討修正容許辦法第28條、第29條之1、第33條及第21條附表4，並於115年7月8日報送預告前通報單及容許辦法修正草案予行政院核復，修正重點如下(對照表詳附錄三)：\n\n(1) 第28條：修正屋頂型綠能設施之申請文件(農業經營實績修正為農業經營事實)，並說明農業設施及其附屬屋頂型綠能設施得同時提出申請。\n\n(2) 第29條之1：漁電共生案場需「配置監控設備」等文字修正為「其他經直轄市、縣(市)主管機關認可足以證明養殖生產之規劃」。\n\n(3) 第33條：農業設施限期改善之期間修正以12個為限，並得展延1次，展延期間不得超過6個月。\n\n(4) 第21條附表4：刪除單一養殖池設置地面型綠能設施40%之規定；明定漁電共生專區內之特定農業區、一般農業區農牧用地，設置屋頂型或地面型綠能設施，不受該期間有在養事實之限制。\n\n三、農地作光電使用應符合「農業主管機關同意農業用地變更使用審查作業要點」(以下簡稱農變要點)規定，不得有妨礙農業灌排水、農路通行及毗鄰農地農業生產等情形，同時應設置隔離綠帶或設施，以維護既有農民權益，確保農業生產環境完整及農地資源永續利用。\n\n四、109年修正農變要點，限制特定農業區及養殖漁業生產區不得變更作太陽光電使用，增訂未達2公頃之農業用地，除符合但書情形（行政院核定之6.5GW達標計畫），不同意變更作太陽光電使用；並修正第13點規定，對於該類用地變更案件(2公頃以上)，應徵得中央農業主管機關審查同意，以強化整體審查流程。（針對台南小兩甲光電爭議案件，依據113年11月25日行政院召開「農業綠能研商會議」決議，有關農變審查要點第7點之1但書規定之「行政院核定『109年太陽光電6.5GW達標計畫』列管有案之太陽光電專案推動區域。」該類案件，暫不審查。）"}, "源頭管制農業用地接電案件複查作業": {"page": 20, "text": "◎源頭管制農業用地接電案件複查作業\n\n一、政策背景：過往農地申請接電，僅須檢具土地所有權狀，免審申請接電目的，即可向台電公司申請接電，造成農地容易違規使用，且易於轉供鄰近工廠之問題。為杜絕農地新增未登記工廠，行政院109年指示農地接電須出具目的事業主管機關核可文件，遏止新增未登記工廠。爰農業部配合函請地方政府查認農地接電案件，現況有無作農業使用，且台電給電後再進行複查作業。\n\n二、處理原則：已有農業設施容許同意書、農舍使照、農業動力用電證明者等維持原作法；素地接電由公所協助查認（屬事實認定，非行政處分，不得移作貸款、農保、稅賦減免等其他事項用途使用）。\n\n三、精進作為：台電於109至113年提供接電核准件數計46,088件，本署補助地方政府已累計執行15,112件，但整體複查執行率僅有33%，複查違規比例僅有16%，尚無法有效精準針對高風險案件進行查核。為精進複查作業效能，本署篩選台電公司農地用電資料，針對農地用電達一定度數以上之異常者，列為優先複查對象，以提高行政效率並及早發現用電異常案件。113年度先於彰化縣、雲林縣及高雄市等3縣市試辦，篩出月均用電超過1,000度案件共245筆，函請試辦縣市協助複查。114年度擴大至全國22縣市辦理，依台電公司提供109年至113年農業用電案件資料篩選，共計1,514筆，就整體複查結果發現，「疑似違規」(52.6%)、「疑似轉供」(8.3%)及「部分農用，但有建物」(1.8%)，顯示屬於高違規風險案件占比超過6成，具有違規使用或背離農地農用之可能性。顯見設定農地上農業用途用電異常變化標準，採取分級管理作法，可有效提高行政效率，及早發現用電異常案件。另本署亦提供農地用電資料，協同農糧署盤查異常用電情形，經查核不合格者，通知台電公司協助剔除其農業動力用電優惠等相關補助資格，強化補助資源之合規性。\n\n四、未來展望：本署將持續落實農地接電複查作業，並對疑似違規案件，儘速進行查處作為，並建立持續追蹤機制，倘有重複出現用電異常者，督促地方政府落實違規案件裁處作業。並分析常態性農業使用之合理用電量，以簡化查核行政作業，對於接電案件超出用電合理量，儘速納入複查對象。"}}};</script><script>
const U=(()=>{
 const A=DATA.annual, M=DATA.demo, XW=DATA.xw, YRS=['112','113','114'];
 const VIDX=Object.fromEntries(M.VERS.map((x,i)=>[x.id,i]));
 let V=(location.hash.match(/m=(v\d+)/)||[])[1]; if(!VIDX.hasOwnProperty(V)) V='v10';
 const subs=[];
 const byId=Object.fromEntries(A.ind.map(i=>[i.id,i]));
 const KP={}; M.GROUPS.forEach(G=>G.items.forEach(it=>{it.g=G.g;KP[it.lab]=it;}));
 const A2K={}; Object.entries(XW).forEach(([lab,arr])=>arr.forEach(x=>{(A2K[x[0]]=A2K[x[0]]||[]).push({lab,rel:x[1],part:x[2]});}));
 const ver=v=>M.VERS[VIDX[v||V]];
 const mlabel=v=>ver(v).label;
 const val=(lab,v)=>{const it=KP[lab]; if(!it) return null; const x=it.vals[v||V]; return x===undefined?null:x;};
 const mini=(lab,v)=>{const it=KP[lab]; if(!it||!it.mini) return ''; return typeof it.mini==='string'?it.mini:(it.mini[v||V]||'');};
 const part=(s,p)=> p==null?s:(String(s).split('・')[p]||null);
 const n=s=>{ if(s==null) return null; const x=parseFloat(String(s).replace(/,/g,'')); return isNaN(x)?null:x; };
 const prevV=v=>{const i=VIDX[v||V]; return i>0?M.VERS[i-1].id:null;};
 const fmt=(x,d=0)=>x==null?'—':x.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
 const dig=x=>(String(x).split('.')[1]||'').length;
 // 前月比較（與 Demo_v13 相同規則：兩期皆有收錄才比較）
 function mom(lab,v){ v=v||V; const p=prevV(v); const c=val(lab,v); if(c==null) return null; if(!p) return {t:'首期',cls:'d-eq'};
   const q=val(lab,p); if(q==null) return {t:'本期首次收錄',cls:'d-eq'}; if(q===c) return {t:'與前月相同',cls:'d-eq'};
   const a=n(c),b=n(q); if(a!=null&&b!=null&&!String(c).includes('・')){const d=a-b; return {t:`較前月 ${d>0?'+':'−'}${fmt(Math.abs(d),Math.max(dig(String(c).replace(/,/g,'')),dig(String(q).replace(/,/g,''))))}`,cls:d>0?'d-up':'d-dn',prev:q};}
   return {t:`前月 ${q}`,cls:'d-eq',prev:q}; }
 // 115 年所選月份對應到某歷年指標的值
 function cur(id,v){ v=v||V; const L=A2K[id]; if(!L) return null; const x=L[0]; const raw=val(x.lab,v); if(raw==null) return {lab:x.lab,rel:x.rel,raw:null};
   const s=part(raw,x.part); return {lab:x.lab,rel:x.rel,raw:s,unit:KP[x.lab].unit,mini:mini(x.lab,v)}; }
 const canDelta=i=> i.cmp==='可直接比較' && i.verify==='已核';
 const delta=(i,a,b)=>{const x=i.years[a].v,y=i.years[b].v; if(x==null||y==null) return null; return {abs:y-x,pct:x?(y-x)/x*100:null};};
 const sign=d=>d>0?'+':(d<0?'−':'±');
 const dText=(i,a,b,u=true)=>{const d=delta(i,a,b); if(!d) return '—'; const g=Math.max(dig(i.years[a].v),dig(i.years[b].v)); return `${sign(d.abs)}${fmt(Math.abs(d.abs),g)}${u?' '+i.unit:''}`;};
 const pText=(i,a,b)=>{const d=delta(i,a,b); if(!d||d.pct==null) return ''; return `${sign(d.pct)}${Math.abs(d.pct).toFixed(1)}%`;};
 const yLab=(i,k)=> (i.years[k].axis||k)+'年';
 const nY=i=>YRS.filter(k=>i.years[k].v!=null).length;

function vTable(rows){ const L=rows.map(id=>U.byId[id]);
 return `<table class="vt"><tr><th></th>${['112','113','114'].map(a=>`<th>${a} 年</th>`).join('')}</tr>${L.map(i=>`<tr><td><b>${i.name.replace(/（.*?）/g,'')}</b><small>${i.brief}</small>${i.cal?`<small class="vcal"><i>${i.cal.tag}</i>${i.cal.short}　<button onclick="U.openA('${i.id}','cal')">查看差異原因 →</button></small>`:''}</td>${['112','113','114'].map(k=>`<td class="num">${i.years[k].v==null?'—':i.years[k].disp}</td>`).join('')}</tr>`).join('')}</table><p class="vcap">單位：${L.map(i=>i.unit).filter((u,j,a)=>a.indexOf(u)===j).join('、')}。年份為實際統計年度。</p>`; }
function vFigs(f){ return `<div class="vf">${f.figs.map(id=>{const i=U.byId[id],k=ks(i).slice(-1)[0],y=i.years[k]; return `<div><b class="num">${y.disp}</b><span>${i.unit}</span><em>${i.name.replace(/（.*?）/g,'')}</em><small>${y.period}｜${i.role}</small>${i.cal?`<small class="vcal"><i>${i.cal.tag}</i><button onclick="U.openA('${i.id}','cal')">查看差異原因 →</button></small>`:''}</div>`;}).join('')}</div>${f.kp?[].concat(f.kp).map(l=>`<p class="vkp"><b>${l}</b>　${kv(l)??'—'} ${kv(l)!=null?U.KP[l].unit||'':''}<small>${U.SUP[l]?`<i class="supst">${U.SUP[l].status}</i>`:''}${U.kper(l)}</small></p>`).join(''):''}<p class="vcap">各數字統計期間不同，並列不比較。</p>`; }
function vDots(i){ const c=kv('水保戶外教室'); const rows=ks(i).map(k=>[i.years[k].axis+' 年',i.years[k].v,0]); if(c) rows.push([U.mlabel(),U.n(c),1]);
 return `<div class="vd">${rows.map(([l,n,cc])=>`<div class="vdr ${cc?'c':''}"><span>${l}</span><i aria-hidden="true">${'<b></b>'.repeat(n)}</i><em>${n} 處</em></div>`).join('')}</div><p class="vcap">每一點是一處開放中的戶外教室。</p>`; }
const MOB=()=>innerWidth<700;
const FUND=k=>{ let x=DATA.fund[k]; if(typeof x==='string') x=DATA.fund[x]; return x||[]; };
const LV={direct:['直接對應經費','d'],plan:['所屬計畫經費','p']};
function fundAmt(e){ const P=[];
 if(e.kp){ const v=kv(e.kp), m=(U.mini(e.kp)||'').split('（')[0].split('；')[0]; if(v!=null) P.push(`${U.mlabel()}資料版本：${v} ${U.KP[e.kp].unit}，${m}`); }
 if(e.ind){ const i=U.byId[e.ind]; P.push(ks(i).map(k=>`${i.years[k].period} ${i.years[k].disp} ${i.unit}`).join('、')); if(e.ind==='R07'&&U.VIDX[U.V]>=5) P.push('106～114 年累計 4.8 億元（115 年 6 月資料版本起）'); }
 (e.amt||[]).forEach(([a,b])=>P.push(`${a} ${b}`));
 if(e.bud){ const b=U.budRow(e.bud); P.push(b&&b.exe!=null?`115 年預算執行率 ${b.exe.toFixed(2)}%（${U.bud().mon}）`:'115 年預算執行率自 4 月底資料起提供'); }
 return P.join('；'); }
function fundLine(r,f){ const L=FUND(r.k+'/'+f.k); if(!L.length) return '';
 return `<div class="funds" aria-label="與本面向有來源可證明關聯的經費">${L.map((e,j)=>`<div class="fund ${LV[e.lvl][1]}"><span class="tg">${LV[e.lvl][0]}</span><span class="ft"><b>${e.name}</b>${e.lvl==='plan'?'<i class="fpl">（涵蓋多項工作）</i>':''}　${fundAmt(e)}</span><button class="more" onclick="fundWhy('${r.k}/${f.k}',${j})">關聯依據與來源 →</button></div>`).join('')}</div>`; }
window.fundWhy=(k,j)=>{ const e=FUND(k)[j]; const D=s=>s.startsWith('M:')?U.mSrc(s.slice(2)):A.docs[s].short;
 U.show('ovS',`${LV[e.lvl][0]}｜${e.name}`,'只列出有來源可證明關聯的經費',`<div class="fwhy"><p><b>關聯層級</b>${LV[e.lvl][0]}${e.lvl==='plan'?'（計畫或基金涵蓋多項工作，不是本項成果的直接投入金額）':'（原始資料明確顯示用於本項工作）'}</p><p><b>關聯依據</b>${e.basis}</p><p><b>金額</b>${fundAmt(e)}</p><p><b>來源</b></p><ul>${e.src.map(([d,p,q])=>`<li>${D(d)}${p?`　印刷頁 ${p}（PDF 第 ${p+A.docs[d].offset} 頁）`:''}<br><em>「${q}」</em></li>`).join('')}</ul><p class="faint">本展間只列有來源可證明關聯的經費；不以經費與產出數值推算成本效益。</p></div>`); };
function cellOf(i,k,mx){ const y=i.years[k]; if(y.v==null) return '<td class="num faint">—</td>';
 if(i.cls==='flow'&&comparable(i)) return `<td class="num">${y.disp}<i class="bar" style="width:${Math.max(4,y.v/mx*100)}%"></i></td>`;
 return `<td class="num">${y.disp}${i.cls==='point'&&i.pt?`<small>${i.pt}</small>`:''}${y.est?'<small>推估</small>':''}</td>`; }
function diffOf(i){ if(i.cal) return `<span class="caltag ${i.cal.tag==='統計範圍不同'?'d':'t'}">${i.cal.tag}</span><span class="cals">${i.cal.short}</span><button class="calbtn" onclick="U.openA('${i.id}','cal')">查看差異原因 →</button>`; if(i.noTrend) return '同一事件不同版本，不比較'; if(!comparable(i)) return '未計算差額'; const K=ks(i); if(K.length<2) return '部分年度未載';
 const a=i.years[K[0]],b=i.years[K[K.length-1]], d=b.v-a.v, dp=Math.max(...[a,b].map(y=>((y.disp.split('.')[1])||'').length)); return d===0?`${a.axis}～${b.axis} 年相同`:`${a.axis}→${b.axis} 年 ${d>0?'+':'−'}${U.fmt(Math.abs(d),dp)} ${i.unit}`; }
function vRoad(){ const g=U.tgt('農路已改善')[0]; if(!g) return `<p class="vcap" style="font-size:15px">115 年農路改善長度自 6 月起提供；請把資料月份切到 6 月以後。</p>`; const p=Math.min(100,g.a/g.t*100);
 return `<div class="vr"><div class="vrb"><i style="width:${p}%"></i></div><div class="vrl"><span><b>${U.fmt(g.a)}</b> 公里已改善</span><span>年度預定 ${U.fmt(g.t)} 公里</span></div></div><p class="vcap">115 年截至 ${mm()} 月的累計（未滿年度）；歷年筆記本沒有年度完成長度。</p>`; }
function yearTable(L,hl){ const cols=[...new Set(L.flatMap(i=>ks(i).map(k=>i.years[k].axis)))].sort(); const C=cols.length?cols:['112','113','114'];
 const row=i=>{const mx=Math.max(...ks(i).map(k=>i.years[k].v)); const c=U.cur(i.id); const cc=c&&c.raw!=null&&c.rel!=='diff'?`${c.raw}${c.rel==='ytd'?'<small>今年累計，未滿年度</small>':c.rel==='yearend'?'<small>至前一年底累計</small>':''}`:'<span class="faint">—</span>';
  return `<tr class="${hl.includes(i.id)?'hl':''}" data-id="${i.id}"><td class="l"><button class="nm" onclick="U.openA('${i.id}')">${i.name}<span>詳情 →</span></button><small><em class="rl">${i.role}</em>${i.unit}${hl.includes(i.id)?'<em class="here">目前面向</em>':''}</small></td>${C.map(a=>{const k=U.YRS.filter(k=>i.years[k].v!=null&&i.years[k].axis===a); return k.length>1?`<td class="num">${k.map((x,j)=>`${i.years[x].disp}<small>${j?'更新判釋':'初版判釋'}</small>`).join('')}</td>`:k.length?cellOf(i,k[0],mx):'<td class="num faint">—</td>';}).join('')}<td class="num cur">${cc}</td><td class="df">${diffOf(i)}</td></tr>`;};
 const G=['持續服務','累計推進','年度工作量','管理與監測','產業規模','推估值','投入'].map(g=>[g,L.filter(i=>i.role===g)]).filter(x=>x[1].length);
 return `<div class="tw"><table class="yt"><thead><tr><th class="l">指標</th>${C.map(a=>`<th>${a} 年</th>`).join('')}<th class="cur">${U.mlabel()}</th><th class="l">差額或說明</th></tr></thead>${G.map(([g,A2])=>`<tbody><tr class="g"><td colspan="${C.length+3}">${g}</td></tr>${A2.map(row).join('')}</tbody>`).join('')}</table></div>`; }
function renderShow(){ const r=rm(), f=fc(), i=U.byId[f.key], [h1,h2]=f.st();
 const viz=f.viz==='flow'?vFlow(i):f.viz==='step'?vStep(i):f.viz==='table'?vTable(f.rows):f.viz==='figs'?vFigs(f):f.viz==='road'?vRoad():vDots(i);
 const hlIds=[f.key,...(f.rows||[]),...(f.figs||[])];
 const facNav=r.fac.length>1?`<nav class="facs" aria-label="${r.t}的推動面向"><span>本領域推動面向</span>${r.fac.map((x,j)=>`<button class="${x.k===F?'on':''}" aria-pressed="${x.k===F}" onclick="nav({f:'${x.k}'})">${x.n}${j===0?'<small>主成果</small>':''}</button>`).join('')}</nav>`:'';
 const back=PREV&&!(PREV.t==='show'&&PREV.p===P&&PREV.f===F)?`<div class="sback" id="sback"><span>已由搜尋前往「${r.t}／${f.n}」。</span><button onclick="gBack()">← 回到搜尋前的${PREV.t==='all'?'「全部指標」':'「'+where(PREV)+'」'}</button></div>`:'';
 document.getElementById('view-show').innerHTML=`<section class="stage" id="stage" data-room="${P}" data-fac="${F}"><div class="wrap">${back}${facNav}<div class="sg"><div class="sl"><div class="kick"><span class="ty">${f.type}</span>${r.t}｜${f.n}｜${U.mlabel()}</div><h1>${h1}</h1><p class="dek">${h2}</p>
  <div class="acts"><button class="cta" onclick="${i?`U.openA('${f.key}')`:''}">查看詳情與來源 →</button><button class="cta2" aria-expanded="${Y}" aria-controls="yr" onclick="toggleYear()">${Y?'收合年度比較 ▴':'展開本領域年度比較 ▾'}</button></div></div><figure class="sv">${viz}</figure></div></div></section>
 <div class="wrap below">${fundLine(r,f)}</div>
 <section class="yr ${Y?'open':''}" id="yr" ${Y?'':'hidden'} aria-label="${r.t}年度比較">
  <div class="ybar"><div class="wrap ybi"><button class="yback" onclick="closeYear()">▲ 收合，回到「${r.t}」展台</button><span class="ywhere">正在查看：<b>${r.t}</b> 的年度比較（${r.ids.length} 項）｜資料月份 ${U.mlabel()}</span></div></div>
  <div class="wrap"><p class="means">年份為實際統計年度；「累計數」「現有數」為各年 12 月筆記本記載數。細長條只畫在可直接比較的年度，底色為目前面向的指標。</p>${yearTable(r.ids.map(id=>U.byId[id]),hlIds)}
  <div class="yfoot"><button class="yback" onclick="closeYear()">▲ 收合，回到「${r.t}」展台</button></div></div></section>`; }
const RM_={matches:true}; // 捲動一律立即完成，避免動畫中途畫面位置不明
window.toggleYear=()=>{ if(Y){ closeYear(); return; } nav({y:true},{scroll:()=>document.getElementById('yr').scrollIntoView({behavior:RM_.matches?'auto':'smooth',block:'start'})}); };
window.closeYear=()=>{ nav({y:false},{scroll:()=>document.getElementById('stage').scrollIntoView({behavior:RM_.matches?'auto':'smooth',block:'start'})}); };

const SYN={'教室':'戶外教室','農再':'農村再生','坡地':'山坡地 坡地 水保','遊客':'遊客','雨量':'雨量'};
function renderAll(){ const el=document.getElementById('view-all');
 if(!el.dataset.init){ el.innerHTML=`<div class="wrap"><div class="ihead"><div><div class="kick">全部指標</div><h1>48 項歷年共同指標與 115 年月報補充指標</h1><p class="means" style="margin-top:6px">點任一列查看詳情、統計期間與來源頁碼。</p></div><div class="srch"><input id="aq" type="search" placeholder="輸入關鍵字，例如：戶外教室" autocomplete="off" aria-label="搜尋指標"><select id="ac" aria-label="分類">${['全部',...A.cats,'115 年月報'].map(c=>`<option value="${c}">${c==='115 年月報'?'115 年月報補充指標':c}</option>`).join('')}</select><span class="faint" id="an" style="font-size:13px"></span></div></div><div class="idx" id="abody"></div></div>`;
  el.dataset.init=1; document.getElementById('aq').oninput=e=>{Q=e.target.value;renderAll();}; document.getElementById('ac').onchange=e=>{QC=e.target.value;renderAll();}; }
 const q=Q.trim(), hitIds=q?new Set(U.search(q).map(e=>e.id)):null; /* 與搜尋共用比對邏輯 */
 const LA=QC==='115 年月報'?[]:A.ind.filter(i=>(QC==='全部'||i.cat===QC)&&(!hitIds||hitIds.has(i.id)));
 const LK=(QC==='全部'||QC==='115 年月報')?Object.keys(U.SUP).filter(l=>!hitIds||hitIds.has(l)).map(l=>U.KP[l]):[];
 document.getElementById('an').textContent=`${LA.length+LK.length} 項`;
 const val=i=>{const L=U.latest(i); return L.val==null?'<span class="faint">未載</span>':`${L.val} ${L.unit||''}<small>${L.per}</small>`;}; /* 與搜尋共用「最近可用數值＋統計期間」 */
 let h=[...A.cats].filter(c=>LA.some(i=>i.cat===c)).map(c=>`<div class="icat"><h2>${c}</h2>${LA.filter(i=>i.cat===c).map(i=>`<div class="irow"><button onclick="U.openA('${i.id}')">${i.name}</button><span class="v num">${val(i)}</span><span class="go" aria-hidden="true">›</span></div>`).join('')}</div>`).join('');
 if(LK.length) h+=`<div class="icat"><h2>115 年月報補充指標</h2>${LK.map(it=>`<div class="irow"><button onclick="U.openK('${it.lab}')">${it.lab}</button><span class="v num">${U.val(it.lab)??'—'} ${U.val(it.lab)!=null?(it.unit||''):''}<small>${U.SUP[it.lab]?`<i class="supst">${U.SUP[it.lab].status}</i>`:''}${U.kper(it.lab)}</small></span><span class="go" aria-hidden="true">›</span></div>`).join('')}</div>`;
 h+=`<div class="icat budy"><h2>全署預算｜年度比較</h2>${yearTable(BUD.map(id=>U.byId[id]),[])}</div>`;
 document.getElementById('abody').innerHTML=h||`<p class="faint">找不到「${U.esc(q)}」。請改用較短的關鍵字，或把分類改回「全部」。</p>`;
 document.querySelectorAll('#abody .irow').forEach(r=>{r.style.cursor='pointer'; r.onclick=e=>{ if(e.target.tagName!=='BUTTON') r.querySelector('button').click(); };}); }


function frame(){ const mode=window.TAB==='all'?'all':(Y?'year':'show');
 document.querySelectorAll('#modes button').forEach(b=>{b.classList.toggle('on',b.dataset.v===mode);b.setAttribute('aria-current',b.dataset.v===mode?'page':'false');});
 const rn=document.getElementById('rooms'); rn.parentNode.style.display=window.TAB==='all'?'none':'block';
 rn.innerHTML=RM.map(r=>`<button class="${r.k===P?'on':''}" aria-pressed="${r.k===P}" data-k="${r.k}"><b>${r.t}</b><span>${r.fac.length>1?r.fac.length+' 個面向':r.fac[0].type}</span></button>`).join('');
 rn.querySelectorAll('button').forEach(b=>b.onclick=()=>nav({p:b.dataset.k}));
 ['show','all'].forEach(v=>document.getElementById('view-'+v).hidden=v!==window.TAB); }
function render(){ frame(); if(window.TAB==='show') renderShow(); if(window.TAB==='all') renderAll(); setHash(); }
// 上方「年度比較」：在目前展間下方展開，不換頁
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{ const v=b.dataset.v;
 if(v==='all') nav({t:'all'},{scroll:()=>scrollTo(0,0)});
 else if(v==='year') nav({t:'show',y:true},{scroll:()=>document.getElementById('yr').scrollIntoView({block:'start'})});
 else nav({t:'show',y:false},{scroll:()=>scrollTo(0,0)}); });
// ── 全域搜尋：不受目前展間限制；點選後前往展間與面向、開詳情或年度比較，並可回到搜尋前的位置
let PREV=null;
function placeOf(id){ if(U.SUP[id]){ const s=U.SUP[id]; return {p:s.room,f:s.fac,ex:true}; } const r=RM.find(r=>r.ids.includes(id)); if(!r) return null;
 const f=r.fac.find(f=>f.key===id||(f.rows||[]).includes(id)||(f.figs||[]).includes(id))||r.fac.find(f=>FUND(r.k+'/'+f.k).some(e=>e.ind===id));
 return f?{p:r.k,f:f.k,ex:true}:{p:r.k,f:r.fac[0].k,ex:false}; }
const where=pl=>{ const r=RM.find(r=>r.k===pl.p); return pl.ex===false?r.t+'（本領域年度比較表）':r.t+'／'+r.fac.find(f=>f.k===pl.f).n; };
const roomItems=()=>RM.flatMap(r=>r.fac.map(f=>({kind:'topic',id:r.k+'/'+f.k,name:r.t+'｜'+f.n,alias:r.t+' '+f.type,hay:f.st().join(' ')})));
function gsRender(){ const q=document.getElementById('gq').value, box=document.getElementById('gres'); document.getElementById('gclr').hidden=!q;
 if(!q.trim()){ box.hidden=true; box.innerHTML=''; return; }
 const L0=U.search(q,roomItems()), L=L0.slice(0,40); box.hidden=false;
 box.innerHTML=!L0.length?`<p class="gnone" role="status">找不到「${U.esc(q.trim())}」。可改用較短的字詞（例如「青年」「溪流」「工程」），或按「清除」。</p>`
  :`<p class="gcount" role="status">找到 ${L0.length} 筆${L0.length>L.length?`，顯示前 ${L.length} 筆`:''}｜數值隨資料月份 ${U.mlabel()} 更新</p><ol>${L.map(gItem).join('')}</ol>`; }
function gItem(e){ if(e.kind==='topic'){ const [p,f]=e.id.split('/'); return `<li class="gr"><div class="grh"><em class="gk">展間面向</em><b>${e.name}</b></div><div class="gra"><button class="pri" onclick="gGo('${p}','${f}',null,'')">前往此展間 ›</button></div></li>`; }
 const x=U.rowInfo(e), pl=placeOf(e.id), isInd=e.kind==='ind';
 return `<li class="gr"><div class="grh"><em class="gk">${isInd?'指標':'月報補充指標'}</em><b>${e.name}</b><span class="ht ${x.hc}">${x.ht}</span></div>
  <div class="grm"><span>${pl?'展間：'+where(pl):'分類：'+e.cat+'（未列入展間，可在全部指標查看）'}</span><span class="gv"><b class="num">${x.val==null?'—':x.val}</b> ${x.val==null?'本期未收錄':x.unit||''}</span><span class="gp">${x.per}</span></div>
  <div class="gra">${pl?(pl.ex===false?`<button class="pri" onclick="gGo('${pl.p}','${pl.f}','${e.id}','year')">展開「${RM.find(r=>r.k===pl.p).t}」年度比較並標示此項 ›</button>`:`<button class="pri" onclick="gGo('${pl.p}','${pl.f}','${U.esc(e.id)}','detail')">前往「${where(pl)}」並開啟詳情 ›</button>`):`<button class="pri" onclick="gAll('${e.id}')">在全部指標查看 ›</button>`}<button onclick="${isInd?`U.openA('${e.id}')`:`U.openK('${U.esc(e.id)}')`}">只看詳情與來源</button>${pl&&isInd&&pl.ex!==false?`<button onclick="gGo('${pl.p}','${pl.f}','${e.id}','year')">展開年度比較</button>`:''}</div></li>`; }
window.gGo=(p,f,id,act)=>{ const here={t:window.TAB,p:P,f:F,y:Y}; if(!(here.t==='show'&&here.p===p&&here.f===f)) PREV=here; document.getElementById('gres').hidden=true;
 if(act==='year') nav({t:'show',p,f,y:true},{scroll:()=>{ const row=document.querySelector(`#yr tr[data-id="${id}"]`); if(row){ row.classList.add('hit'); row.scrollIntoView({block:'center'}); } else document.getElementById('yr').scrollIntoView({block:'start'}); }});
 else nav({t:'show',p,f,y:false},{scroll:()=>scrollTo(0,0)});
 if(act==='detail'&&id){ if(U.SUP[id]) U.openK(id); else U.openA(id); } };
window.gAll=id=>{ const here={t:window.TAB,p:P,f:F,y:Y}; PREV=here; document.getElementById('gres').hidden=true; nav({t:'all'},{scroll:()=>scrollTo(0,0)}); U.openA(id); };
window.gBack=()=>{ const b=PREV; PREV=null; nav({t:b.t,p:b.p,f:b.f,y:b.y},{scroll:()=>scrollTo(0,0)}); };
(()=>{ const gq=document.getElementById('gq'), box=document.getElementById('gres');
 gq.addEventListener('input',gsRender); gq.addEventListener('focus',()=>{ if(gq.value.trim()) gsRender(); });
 gq.addEventListener('keydown',e=>{ if(e.key==='Escape'){ box.hidden=true; } });
 document.getElementById('gclr').onclick=()=>{ gq.value=''; gsRender(); gq.focus(); };
 document.addEventListener('click',e=>{ if(!e.target.closest('.gs')) box.hidden=true; });
 U.on(()=>{ if(!box.hidden) gsRender(); }); })();
U.on(render);
</script></body></html>
